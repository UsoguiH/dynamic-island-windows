<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-25..200&display=block" rel="stylesheet">
<style>
:root {
  --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
  --soft: linear(0, 0.06 3%, 0.23 7.4%, 0.55 14.6%, 0.81 22.4%, 0.94 29.6%, 1.01 37.4%, 1.03 44.6%, 1.02 55%, 1);
  --page: #d9dbe8; --ink: #1d1b22; --sub: #4a4655;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #17161d; --ink: #f1eff6; --sub: #a9a4b6; } }
:root[data-theme="dark"] { --page: #17161d; --ink: #f1eff6; --sub: #a9a4b6; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: var(--ink); background: var(--page); overflow-x: hidden; }
.page { max-width: 1100px; margin: 0 auto; padding: 22px 16px 60px; display: flex; flex-direction: column; align-items: center; }
.picker { display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: #121116; flex-wrap: wrap; justify-content: center; }
.picker button { all: unset; cursor: pointer; padding: 9px 16px; border-radius: 999px; color: rgba(255,255,255,.62); font: 600 13px Inter; display: flex; gap: 8px; align-items: center; transition: background .25s, color .25s; }
.picker button:hover { color: #fff; }
.picker button.on { background: #fff; color: #111; }
.picker kbd { font: 600 10px Inter; opacity: .5; border: 1px solid currentColor; border-radius: 5px; padding: 1px 5px; }
.blurb { margin: 14px 0 20px; text-align: center; max-width: 720px; min-height: 76px; }
.blurb h2 { margin: 0 0 6px; font: 700 22px Inter; letter-spacing: -.02em; }
.blurb p { margin: 0; font: 400 14px/1.5 Inter; color: var(--sub); }
.stage { width: 100%; display: flex; justify-content: center; min-height: 520px; align-items: flex-start; }
.tools { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tools button { all: unset; cursor: pointer; padding: 9px 15px; border-radius: 999px; background: #121116; color: #fff; font: 600 12.5px Inter; display: flex; gap: 6px; align-items: center; }
.tools button:hover { background: #000; }
.tools .ms { font-size: 17px; }
.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; display: inline-block; white-space: nowrap; -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; user-select: none; }

/* ---------- the island ---------- */
.fit { width: 500px; max-width: 100%; }
.island { position: relative; width: 500px; border-radius: 56px; background: #000; color: #fff; padding: 20px 22px 22px; overflow: hidden; transform-origin: top left; --ac: #0A84FF;
  box-shadow: 0 24px 70px rgba(30, 20, 80, .28), 0 6px 18px rgba(0,0,0,.22); animation: islandIn .7s var(--spring) both; }
@keyframes islandIn { from { transform: scale(.9); opacity: 0; } }
@media (max-width: 532px) { .island { transform: scale(calc((100vw - 32px) / 500px)); } }
button { font: inherit; color: inherit; }
.hd { display: flex; align-items: center; gap: 10px; height: 36px; margin-bottom: 14px; }
.hd b { font: 700 14.5px Inter; }
.hd span.s { font: 400 12.5px Inter; color: rgba(255,255,255,.45); }
.back { all: unset; cursor: pointer; margin-left: auto; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.09); display: grid; place-items: center; flex: none; transition: background .2s, transform .4s var(--spring); }
.back:hover { background: rgba(255,255,255,.18); } .back:active { transform: scale(.88); }
.back .ms { font-size: 18px; }
.lab { font: 600 12px Inter; color: rgba(255,255,255,.5); margin: 16px 4px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.lab em { font: 400 11.5px Inter; color: rgba(255,255,255,.3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field { background: #151517; border-radius: 26px; padding: 15px 18px; transition: background .25s; }
.field:focus-within { background: #1a1a1d; }
textarea, input.big { all: unset; display: block; width: 100%; font: 500 15.5px/1.42 Inter; color: #fff; caret-color: var(--ac); }
textarea { height: 44px; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
textarea::placeholder, input.big::placeholder { color: rgba(255,255,255,.3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { all: unset; cursor: pointer; padding: 8px 13px; border-radius: 999px; background: rgba(255,255,255,.08); font: 600 12.5px Inter; color: rgba(255,255,255,.86); display: inline-flex; align-items: center; gap: 6px; transition: background .2s, color .2s, transform .45s var(--spring); }
.chip:hover { background: rgba(255,255,255,.16); } .chip:active { transform: scale(.93); }
.chip.on { background: var(--ac); color: #fff; }
.chip i.d { width: 8px; height: 8px; border-radius: 3px; background: var(--pc); }
.chip.on i.d { background: #fff; }
.seg { display: flex; background: #151517; border-radius: 999px; padding: 4px; position: relative; }
.seg button { all: unset; cursor: pointer; flex: 1; text-align: center; padding: 9px 0; font: 600 12.5px Inter; color: rgba(255,255,255,.55); position: relative; z-index: 1; transition: color .2s; }
.seg button.on { color: #fff; }
.seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: 60px; border-radius: 999px; background: rgba(255,255,255,.16); transition: left .5s var(--spring), width .5s var(--spring); }
.pdesc { margin: 9px 4px 0; font: 400 12px Inter; color: rgba(255,255,255,.42); min-height: 16px; }
.go { all: unset; box-sizing: border-box; width: 100%; margin-top: 16px; height: 52px; border-radius: 26px; background: #151517; color: rgba(255,255,255,.38); font: 700 14.5px Inter; display: flex; align-items: center; justify-content: center; gap: 9px; transition: background .35s, color .3s, transform .45s var(--spring); position: relative; overflow: hidden; }
.go.ready { background: var(--ac); color: #fff; cursor: pointer; }
.go.ready:hover { transform: scale(1.015); } .go.ready:active { transform: scale(.97); }
.go kbd { font: 700 11px Inter; padding: 3px 7px; border-radius: 7px; background: rgba(255,255,255,.22); opacity: 0; transition: opacity .3s; }
.go.ready kbd { opacity: 1; }
.go.no { animation: no .4s; }
@keyframes no { 20% { transform: translateX(-7px); } 50% { transform: translateX(6px); } 80% { transform: translateX(-3px); } }

/* ---------- Bloub: a ball and two eyes ---------- */
.bl { position: relative; width: var(--s); height: var(--s); flex: none; }
.bl .bb { position: absolute; inset: 0; }
.bl .fly { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 30; pointer-events: none; }
.bl canvas { position: absolute; left: calc(var(--s) * -1.8); top: calc(var(--s) * -1.8); width: calc(var(--s) * 3.6); height: calc(var(--s) * 3.6); pointer-events: none; }
/* while he is being a pencil, a pin or a lock, nothing else leans or bounces him */
.vA .hero, .vB .reader, .vC .rail, .vE .runway { z-index: 4; }
.vD .ask { position: relative; z-index: 4; }
.vC .knob .lean:has(.acting), .vD .ask .tilt:has(.acting) { transform: none; }
.vE .runway.ready .rb .hopper:has(.acting) { animation: none; }

/* ---------- the states, large ---------- */
.vS { padding-bottom: 20px; }
.vS .tabs { display: flex; flex-direction: column; gap: 7px; align-items: center; position: relative; z-index: 40; }
.vS .tabs .tr { display: flex; gap: 6px; align-items: center; }
.vS .tabs .tr small { width: 48px; margin-right: 2px; text-align: right; font: 700 9.5px Inter; letter-spacing: .09em; text-transform: uppercase; color: rgba(255,255,255,.32); }
.vS .tabs button { all: unset; cursor: pointer; box-sizing: border-box; height: 40px; min-width: 40px; padding: 0 10px; border-radius: 999px; font: 650 13px Inter; color: rgba(255,255,255,.55); background: rgba(255,255,255,.08); display: inline-flex; align-items: center; justify-content: center; transition: background .25s, color .25s, padding .5s var(--soft), transform .45s var(--spring); }
.vS .tabs button:hover { color: #fff; background: rgba(255,255,255,.14); } .vS .tabs button:active { transform: scale(.92); }
.vS .tabs button .ms { font-size: 19px; }
.vS .tabs button .lb { max-width: 0; margin-left: 0; opacity: 0; overflow: hidden; white-space: nowrap; transition: max-width .5s var(--soft), margin .5s var(--soft), opacity .3s; }
.vS .tabs button.on { background: #fff; color: #111; padding: 0 15px 0 12px; }
.vS .tabs button.on .lb { max-width: 80px; margin-left: 6px; opacity: 1; }
.vS .big { position: relative; height: 322px; }
.vS .big .bl { position: absolute; left: 50%; top: 178px; margin: -66px 0 0 -66px; }
.vS .cap { text-align: center; min-height: 118px; padding: 0 6px; position: relative; z-index: 40; }
.vS .cap small { font: 700 10.5px Inter; letter-spacing: .09em; text-transform: uppercase; color: rgba(255,255,255,.4); }
.vS .cap b { display: block; font: 750 23px Inter; letter-spacing: -.02em; margin: 4px 0 7px; }
.vS .cap p { margin: 0; font: 400 13px/1.5 Inter; color: rgba(255,255,255,.58); text-wrap: pretty; }
.vS .beats { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; align-content: flex-start; min-height: 58px; margin-top: 12px; position: relative; z-index: 40; }
.vS .beats span { padding: 5px 10px; border-radius: 999px; font: 600 11px Inter; color: rgba(255,255,255,.3); background: rgba(255,255,255,.06); transition: background .18s, color .18s, transform .4s var(--spring); }
.vS .beats span.was { color: rgba(255,255,255,.72); }
.vS .beats span.on { background: #fff; color: #111; transform: scale(1.07); }
.vS .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; position: relative; z-index: 40; }
.vS .bar .btns { display: flex; gap: 6px; }
.vS .bar .again { padding: 8px 9px; }
.vS .keys { margin-top: 12px; text-align: center; font: 500 11.5px Inter; color: rgba(255,255,255,.36); white-space: nowrap; position: relative; z-index: 40; }
.vS .keys kbd { display: inline-block; min-width: 10px; margin: 0 6px 0 14px; padding: 3px 7px; border-radius: 7px; background: rgba(255,255,255,.09); font: 600 10.5px Inter; color: rgba(255,255,255,.66); text-align: center; }
.vS .keys kbd:first-child { margin-left: 0; } .vS .keys kbd + kbd { margin-left: -2px; }
.vS .mini { display: flex; align-items: center; gap: 30px; height: 104px; padding: 0 46px 0 20px; border-radius: 30px; background: #121214; font: 600 12px Inter; color: rgba(255,255,255,.42); white-space: nowrap; }
.vS .mini .bl { margin-top: 12px; }

/* ---------- F · In his hands ---------- */
.vF { --paper: #e9e9ed; padding-bottom: 20px; }
.vF .hd { margin-bottom: 12px; }
.vF .sayw { height: 100px; display: flex; align-items: flex-end; position: relative; z-index: 3; }
.vF .say { position: relative; width: 100%; height: 96px; padding: 16px 20px; border-radius: 30px; background: var(--paper); color: #07070a; transform-origin: 50% 150%; animation: sayIn .75s var(--spring) .3s backwards; transition: height .5s var(--spring); }
@keyframes sayIn { from { transform: scale(.3); opacity: 0; } }
.vF .say textarea { height: 25px; font: 600 18px/25px Inter; letter-spacing: -.012em; color: #07070a; }
.vF .say textarea::placeholder { color: rgba(7,7,10,.34); }
.vF .say .tail { position: absolute; left: 50%; bottom: -7px; width: 22px; height: 22px; margin-left: -11px; border-radius: 5px; background: var(--paper); transform: rotate(45deg); }
.vF .say .chips { position: absolute; left: 16px; right: 16px; bottom: 14px; flex-wrap: nowrap; gap: 5px; transition: opacity .2s, transform .45s var(--spring); }
.vF .say .chip { background: rgba(7,7,10,.08); color: rgba(7,7,10,.8); padding: 7px 11px; font-size: 11.5px; white-space: nowrap; }
.vF .say .chip:hover { background: rgba(7,7,10,.16); }
.vF .say.has .chips { opacity: 0; transform: translateY(8px); pointer-events: none; }
.vF .scene { position: relative; height: 166px; margin-top: 16px; }
.vF .me { position: absolute; left: 50%; top: 20px; margin-left: -52px; transition: transform .6s var(--spring); z-index: 2; }
.vF .me > .bl { animation: meIn .85s var(--spring) .1s backwards; }
@keyframes meIn { from { transform: translateY(60px) scale(.4); opacity: 0; } }
.vF.fanned .me { transform: translateX(32px); }
.vF .prop { all: unset; cursor: pointer; position: absolute; top: 35px; width: 150px; display: flex; flex-direction: column; align-items: center; z-index: 3; -webkit-tap-highlight-color: transparent; }
.vF .pl { left: 21px; } .vF .pr { right: 21px; }
.vF .float { display: block; animation: carry 2.6s ease-in-out infinite alternate; }
.vF .pr .float { animation-delay: -1.3s; }
@keyframes carry { from { transform: translateY(-2.5px); } to { transform: translateY(2.5px); } }
.vF .hold { display: flex; flex-direction: column; align-items: center; }
.vF .thing { display: block; width: 56px; height: 56px; position: relative; z-index: 1; animation: thingIn .7s var(--spring) .8s backwards; transition: transform .45s var(--spring); }
.vF .pr .thing { animation-delay: .95s; }
@keyframes thingIn { from { transform: translateY(-46px) scale(.5); opacity: 0; } }
.vF .prop:hover .thing { transform: translateY(-4px) scale(1.05); }
.vF .prop:active .thing { transform: scale(.93); }
.vF .hand { display: block; width: 24px; height: 24px; margin-top: -5px; border-radius: 50%; background: linear-gradient(48.5deg, #949394 14.6%, #e4e4e5 85.4%); animation: handIn .6s var(--spring) .5s backwards; }
.vF .pl .hand { --hx: 96px; } .vF .pr .hand { --hx: -96px; animation-delay: .6s; }
@keyframes handIn { from { transform: translate(var(--hx), 4px) scale(0); } }
.vF .av { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 18px; background: var(--pc); font: 800 24px Inter; color: rgba(0,0,0,.72); }
.vF .lk { display: block; position: relative; width: 56px; height: 56px; }
.vF .lk .sh { position: absolute; inset: 0; overflow: visible; }
.vF .lk .sh path { fill: none; stroke: url(#lkg); stroke-width: 7; stroke-linecap: round; transform-origin: 16px 30px; transition: transform .6s var(--spring); }
.vF .lk[data-v="ask"] .sh path { transform: translateY(-9px); }
.vF .lk[data-v="auto"] .sh path { transform: translateY(-9px) scaleX(-.8); }
.vF .lk .bd { position: absolute; left: 3px; right: 3px; bottom: 0; height: 38px; border-radius: 13px; background: linear-gradient(48.5deg, #9f9ea0 14.6%, #e8e8e9 85.4%); display: grid; place-items: center; }
.vF .lk .bd .ms { font-size: 22px; color: #07070a; }
.vF .nm { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 10px; animation: nmIn .5s ease-out 1.05s backwards; transition: opacity .2s; }
@keyframes nmIn { from { opacity: 0; transform: translateY(6px); } }
.vF .nm b { font: 700 14px Inter; letter-spacing: -.01em; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vF .nm small { font: 500 11.5px Inter; color: rgba(255,255,255,.42); display: inline-flex; align-items: center; gap: 2px; }
.vF .nm small .ms { font-size: 13px; }
.vF .fan { position: absolute; left: 96px; top: 98px; width: 0; height: 0; z-index: 6; }
.vF .ft { all: unset; cursor: pointer; position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; border-radius: 11px; background: var(--pc); font: 800 14px Inter; color: rgba(0,0,0,.72); display: grid; place-items: center; transform: translate(0, -35px) scale(.2); opacity: 0; pointer-events: none; transition: transform .5s var(--spring), opacity .18s; }
.vF .fan.open .ft { transform: translate(var(--x), var(--y)); opacity: 1; pointer-events: auto; transition-delay: calc(var(--i) * 22ms); }
.vF .fan.open .ft:hover { transform: translate(var(--x), var(--y)) scale(1.25); transition-delay: 0s; z-index: 1; }
.vF .fan.open .ft.on { opacity: .32; }
.vF .fan .ft.pick { transform: translate(0, -35px) scale(1.75); opacity: 1; transition-delay: 0s; z-index: 2; }
.vF .pdesc { text-align: center; margin: 4px 4px 0; transition: opacity .2s; }
.vF .go { margin-top: 12px; }
.vF .gone { position: absolute; left: 0; right: 0; top: 168px; text-align: center; opacity: 0; transform: translateY(14px); transition: opacity .4s, transform .7s var(--spring); pointer-events: none; }
.vF .gone b { display: block; font: 750 32px Inter; letter-spacing: -.03em; }
.vF .gone small { display: block; margin-top: 8px; font: 400 13.5px Inter; color: rgba(255,255,255,.5); }
.vF.left .gone { opacity: 1; transform: none; }
.vF.away .nm, .vF.away .pdesc, .vF.away .go { opacity: 0; pointer-events: none; }

/* ---------- A · Bud ---------- */
.vA { padding-top: 16px; }
.vA .hero { position: relative; height: 118px; margin-bottom: 8px; }
.vA svg { position: absolute; left: 0; top: 0; overflow: visible; cursor: pointer; }
.vA .who { position: absolute; left: 236px; top: 22px; right: 44px; transition: opacity .3s; }
.vA .who small { font: 700 10.5px Inter; letter-spacing: .09em; text-transform: uppercase; color: rgba(255,255,255,.4); }
.vA .who h3 { margin: 3px 0 9px; font: 700 21px Inter; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vA .ticks { display: flex; gap: 6px; }
.vA .ticks span { font: 600 11.5px Inter; padding: 5px 9px 5px 6px; border-radius: 999px; background: rgba(255,255,255,.07); color: rgba(255,255,255,.4); display: inline-flex; gap: 3px; align-items: center; transition: background .35s, color .35s, transform .5s var(--spring); }
.vA .ticks .ms { font-size: 13px; opacity: .35; transition: opacity .3s; }
.vA .ticks span.on { background: color-mix(in srgb, var(--ac) 26%, #000); color: #fff; transform: scale(1.04); }
.vA .ticks span.on .ms { opacity: 1; }
.vA .hero .back { position: absolute; right: 0; top: 4px; }
.vA .said { position: absolute; left: 236px; top: 38px; font: 700 19px Inter; opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .5s var(--spring); pointer-events: none; }
.vA .said small { display: block; font: 400 12.5px Inter; color: rgba(255,255,255,.5); margin-top: 4px; }
.vA.away .who { opacity: 0; } .vA.away .said { opacity: 1; transform: none; }

/* ---------- B · Sentence ---------- */
.vB .sent { position: relative; padding: 6px 0 4px 66px; min-height: 196px; }
.vB .reader { position: absolute; left: 4px; top: 8px; transition: top .55s var(--spring); }
.vB .line { margin: 0; font: 650 23px/1.62 Inter; letter-spacing: -.02em; color: rgba(255,255,255,.92); }
.vB .w { display: inline-block; }
.vB .blank { display: inline-block; min-width: 150px; max-width: 100%; outline: none; color: var(--ac); caret-color: var(--ac); background: linear-gradient(var(--ac), var(--ac)) left bottom / 100% 2.5px no-repeat; padding: 0 2px; word-break: break-word; vertical-align: top; filter: brightness(1.35); }
.vB .blank:empty::before { content: attr(data-ph); color: rgba(255,255,255,.26); }
.vB .tok { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 1px 12px 1px 9px; border-radius: 14px; background: rgba(255,255,255,.1); vertical-align: baseline; line-height: 1.42; transition: background .2s, transform .45s var(--spring); overflow: hidden; }
.vB .tok:hover { background: rgba(255,255,255,.18); } .vB .tok:active { transform: scale(.95); }
.vB .tok .ms { font-size: 19px; color: var(--ac); filter: brightness(1.35); }
.vB .tok .tv { display: inline-block; }
.vB .tok .ar { font-size: 18px; opacity: .45; margin-left: -3px; }
.vB .starts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 14px 0 0 66px; }
.vB .starts small { font: 600 12px Inter; color: rgba(255,255,255,.4); margin-right: 2px; }
.vB .pop { position: absolute; z-index: 5; min-width: 200px; padding: 6px; border-radius: 22px; background: #1b1b1f; box-shadow: 0 18px 40px rgba(0,0,0,.6); transform-origin: top left; animation: pop .45s var(--spring); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }
.vB .opt { all: unset; cursor: pointer; display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 16px; font: 600 13px Inter; width: calc(100% - 24px); animation: optIn .4s var(--spring) both; animation-delay: calc(var(--i) * 28ms); }
@keyframes optIn { from { transform: translateY(8px); opacity: 0; } }
.vB .opt:hover { background: rgba(255,255,255,.1); }
.vB .opt.on { background: color-mix(in srgb, var(--ac) 30%, transparent); }
.vB .opt small { margin-left: auto; font: 400 11.5px Inter; color: rgba(255,255,255,.4); }
.vB .opt .ms { font-size: 17px; color: rgba(255,255,255,.7); }
.vB .done { position: absolute; left: 66px; top: 44px; font: 700 23px Inter; letter-spacing: -.02em; opacity: 0; transform: translateY(10px); transition: opacity .4s, transform .6s var(--spring); pointer-events: none; }
.vB .done small { display: block; font: 400 13px Inter; color: rgba(255,255,255,.5); letter-spacing: 0; margin-top: 6px; }
.vB.away .done { opacity: 1; transform: none; }

/* ---------- C · Bloub is the knob ---------- */
.vC .field .chips { margin-top: 10px; }

<script>
const SPRING = getComputedStyle(document.documentElement).getPropertyValue('--spring').trim();
const COLORS = ['#0A84FF', '#FF453A', '#7D5CFF', '#FF5C9E', '#30D158', '#FF9F0A'];

  { n: 'DynmicIsland', c: '#BF5AF2', t: 'now' }, { n: 'Duolingo', c: '#30D158', t: '2h' }, { n: 'Qudrati', c: '#0A84FF', t: '1d' }, { n: 'new app', c: '#FF9F0A', t: '2d' },

];
const PERMS = [
  { id: 'default', n: 'Your default', ic: 'tune', say: 'follows my usual rules', d: "Follows your terminal's rules. Its questions come to you here." },
  { id: 'ask', n: 'Ask first', ic: 'front_hand', say: 'asks me first', d: 'Asks you before every edit and every command.' },
  { id: 'read', n: 'Read-only', ic: 'visibility', say: 'only reads', d: 'Looks and answers. It changes nothing.' },
  { id: 'auto', n: 'Auto edits', ic: 'bolt', say: 'edits on its own', d: 'Edits files without asking. Still asks before commands.' },
];

const perm = id => PERMS.find(p => p.id === id);
let colorAt = 0;

const $ = h => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- a mounted version: its timers die with it ---------- */
let M = null, cur = 0;
function newMount() {
  const m = { alive: true, offs: [],
    later(fn, ms) { const id = setTimeout(() => m.alive && fn(), ms); m.offs.push(() => clearTimeout(id)); },
    every(fn, ms) { const id = setInterval(() => m.alive && fn(), ms); m.offs.push(() => clearInterval(id)); },
    on(t, ev, fn, o) { t.addEventListener(ev, fn, o); m.offs.push(() => t.removeEventListener(ev, fn, o)); },
    frame(fn) { let last = performance.now(); const step = t => { if (!m.alive) return; fn(t, Math.min(.05, (t - last) / 1000)); last = t; requestAnimationFrame(step); }; requestAnimationFrame(step); },
    wait: ms => new Promise(r => m.later(r, ms)),
    kill() { m.alive = false; m.offs.forEach(f => f()); } };
  return m;
}

/* ---------- Bloub, as in the state film: a lit ball with two ink eyes, and three things he can turn into ---------- */
const TAU = Math.PI * 2, INK = '#07070a';
const lerp = (a, b, t) => a + (b - a) * t, c01 = v => Math.max(0, Math.min(1, v)), seg = (t, a, b) => c01((t - a) / (b - a));
const Ez = { o: t => 1 - (1 - t) ** 3, i: t => t * t * t, io: t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2, back: t => 1 + 3.2 * (t - 1) ** 3 + 2.2 * (t - 1) ** 2 };
const ring = (t, f, d) => t <= 0 ? 0 : Math.exp(-d * t) * Math.sin(TAU * f * t);          // what is left of a knock
const pulse = (t, a, b, c, d) => t < a || t > d ? 0 : t < b ? (t - a) / (b - a) : t < c ? 1 : (d - t) / (d - c);
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
/** A closed shape through points [x, y, corner radius]; a radius never eats more than its edges have. */
function rpoly(P, pts) {
  const n = pts.length, D = [];
  for (let i = 0; i < n; i++) {
    const a = pts[(i + n - 1) % n], v = pts[i], c = pts[(i + 1) % n], d1 = [a[0] - v[0], a[1] - v[1]], d2 = [c[0] - v[0], c[1] - v[1]], l1 = Math.hypot(d1[0], d1[1]) || 1e-6, l2 = Math.hypot(d2[0], d2[1]) || 1e-6;
    const th = Math.acos(clamp((d1[0] * d2[0] + d1[1] * d2[1]) / (l1 * l2), -1, 1)), tn = Math.tan(th / 2);
    D.push({ u1: [d1[0] / l1, d1[1] / l1], u2: [d2[0] / l2, d2[1] / l2], l2, tn, t: th > 3.12 ? 0 : v[2] / tn });
  }
  for (let k = 0; k < 2; k++) for (let i = 0; i < n; i++) { const j = (i + 1) % n, s = D[i].t + D[j].t; if (s > D[i].l2) { const f = D[i].l2 / s; D[i].t *= f; D[j].t *= f; } }
  for (let i = 0; i < n; i++) {
    const v = pts[i], d = D[i], p1 = [v[0] + d.u1[0] * d.t, v[1] + d.u1[1] * d.t], p2 = [v[0] + d.u2[0] * d.t, v[1] + d.u2[1] * d.t];

  }
  P.closePath(); return P;

/* ================================================================ F · In his hands: no form. The task is what he says, and he holds the project in one hand and the rule in the other */

  return { el, ...api };
}
