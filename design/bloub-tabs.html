<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloub Moves Tabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&family=Inter:wght@400..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-25..200&display=block" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root {
  --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
  --spring-soft: linear(0, 0.06 3%, 0.23 7.4%, 0.55 14.6%, 0.81 22.4%, 0.94 29.6%, 1.01 37.4%, 1.03 44.6%, 1.02 55%, 1);
  --page: #e9e6f2;
  --ink: #1d1b22;
}
@property --glow { syntax: '<color>'; inherits: true; initial-value: #2f6bff; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: var(--ink); overflow-x: hidden;
  background:
    radial-gradient(60% 50% at 12% 18%, #9fb0ff 0%, transparent 60%),
    radial-gradient(50% 45% at 88% 14%, #ffa9cf 0%, transparent 60%),
    radial-gradient(55% 50% at 72% 88%, #ffd29b 0%, transparent 62%),
    radial-gradient(50% 50% at 18% 90%, #95e8da 0%, transparent 60%),
    var(--page);
}
.page { max-width: 1100px; margin: 0 auto; padding: 22px 16px 60px; display: flex; flex-direction: column; align-items: center; }
.picker { display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(20, 18, 26, .9); box-shadow: 0 10px 30px rgba(40, 20, 80, .25); flex-wrap: wrap; justify-content: center; align-items: center; }
.picker button { all: unset; cursor: pointer; padding: 9px 16px; border-radius: 999px; color: rgba(255,255,255,.62); font: 600 13px Inter; display: flex; gap: 8px; align-items: center; transition: background .25s, color .25s; }
.picker button:hover { color: #fff; }
.picker button.on { background: #fff; color: #111; }
.picker kbd { font: 600 10px Inter; opacity: .5; border: 1px solid currentColor; border-radius: 5px; padding: 1px 5px; }
.picker .sep { width: 1px; height: 22px; background: rgba(255,255,255,.18); margin: 0 4px; }
.blurb { margin: 14px 0 22px; text-align: center; max-width: 740px; }
.blurb h2 { margin: 0 0 6px; font: 700 22px Inter; letter-spacing: -.02em; }
.blurb p { margin: 0; font: 400 14px/1.5 Inter; color: #4a4655; }
.stage { position: relative; width: 100%; display: flex; justify-content: center; min-height: 420px; }
.hint { margin-top: 18px; font: 500 12.5px Inter; color: #5b5668; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

/* ---------- the island (the app's black body) ---------- */
.island {
  position: relative; width: 724px; height: 404px; border-radius: 46px; background: #000; color: #fff;
  box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 24px 70px rgba(70, 40, 160, .35), 0 6px 18px rgba(0,0,0,.25);
  overflow: hidden; transform-origin: top center;
  animation: islandIn .7s var(--spring) both;
}
@keyframes islandIn { from { transform: scale(.82, .5); border-radius: 60px; opacity: .2 } to { transform: none; opacity: 1 } }
@media (max-width: 760px) { .island { transform: scale(calc(100vw / 760)); } }

.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; display: inline-block; text-transform: none; letter-spacing: normal; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; user-select: none; }
.ms.fill { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }

.bloub { display: inline-block; flex: none; }
.face { width: 40px; height: 40px; flex: none; cursor: pointer; transition: transform .5s var(--spring); }
.face:hover { transform: scale(1.1) rotate(-6deg); }

/* ---------- shared panel content ---------- */
.panel { position: absolute; inset: 0; padding: 0; }
.cards { display: grid; gap: 12px; height: 100%; }
.card { background: var(--card, rgba(255,255,255,.07)); border-radius: var(--card-r, 22px); padding: 14px 16px; position: relative; overflow: hidden; min-height: 0; }
.card h4 { margin: 0 0 10px; font: 600 13px var(--font, Inter); display: flex; justify-content: space-between; align-items: center; color: rgba(255,255,255,.92); }
.card h4 small { font: 500 11px var(--font, Inter); color: rgba(255,255,255,.42); }
.muted { color: rgba(255,255,255,.5); }
.row { display: flex; align-items: center; gap: 10px; }
.list .item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: var(--item-r, 16px); background: rgba(255,255,255,.055); margin-bottom: 7px; font: 500 13px var(--font, Inter); }
.list .item .grow { flex: 1; min-width: 0; }
.list .item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list .item .s { font-size: 11.5px; color: rgba(255,255,255,.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.pill-btn { all: unset; cursor: pointer; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.12); font: 600 12px var(--font, Inter); transition: background .2s, transform .3s var(--spring); }
.pill-btn:hover { background: rgba(255,255,255,.2); }
.pill-btn:active { transform: scale(.94); }
.pill-btn.accent { background: var(--accent, #0A84FF); color: var(--on-accent, #fff); }
.ico-tile { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.ico-tile .ms, .ico-tile i { font-size: 18px; }
.big { font: 600 34px/1 var(--font, Inter); letter-spacing: -.02em; }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
.bar > b { display: block; height: 100%; border-radius: 3px; }
.chipset { display: flex; flex-wrap: wrap; gap: 6px; }
.chipset span { padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,.1); font: 600 11.5px var(--font, Inter); cursor: pointer; }
.chipset span.on { background: var(--accent, #0A84FF); color: var(--on-accent, #fff); }
.mono { font-variant-numeric: tabular-nums; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 100%; }
.bars b { flex: 1; border-radius: 3px 3px 1px 1px; background: rgba(255,255,255,.25); transition: height .6s var(--spring); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font: 600 12.5px var(--font, Inter); }
.cal .h { font-size: 10.5px; color: rgba(255,255,255,.42); padding-bottom: 4px; }
.cal .d { padding: 6px 0; border-radius: 999px; }
.cal .d.today { background: var(--accent, #FF453A); color: var(--on-accent, #fff); }
.cal .d.we { color: rgba(255,255,255,.4); }
.note { border-radius: 18px; padding: 12px 14px; background: rgba(255, 214, 10, .12); font: 600 12.5px/1.45 var(--font, Inter); color: rgba(255,255,255,.92); display: flex; flex-direction: column; justify-content: space-between; }
.note small { font: 600 11px var(--font, Inter); color: rgba(255,255,255,.4); }
.check { width: 18px; height: 18px; border-radius: 50%; border: 1.6px solid rgba(255,255,255,.4); flex: none; display: grid; place-items: center; }
.check.done { background: #30D158; border-color: #30D158; }
.done-t { color: rgba(255,255,255,.38); text-decoration: line-through; }
.art { width: 104px; height: 104px; border-radius: 22px; background: linear-gradient(135deg, #6E4BFF, #FF5FA2); position: relative; flex: none; }
.art::after { content: ""; position: absolute; width: 34px; height: 34px; border-radius: 50%; right: 16px; top: 16px; background: rgba(255,255,255,.22); }
.wave { display: inline-flex; gap: 3px; align-items: center; height: 26px; }
.wave b { width: 3.4px; border-radius: 2px; background: #FF5FA2; animation: wave 1s ease-in-out infinite alternate; }
@keyframes wave { from { height: 25% } to { height: 100% } }

/* =========================================================== D1 · M3 primary tabs */
.m3 { --font: 'Roboto Flex', Roboto, sans-serif; --accent: #D0BCFF; --on-accent: #381E72; --card: #1D1B20; --card-r: 16px; --item-r: 12px; font-family: var(--font); }
.m3 .ms { color: inherit; }
.d1-top { position: absolute; left: 0; right: 0; top: 0; height: 74px; display: flex; align-items: flex-end; padding: 0 22px 0 20px; gap: 10px; border-bottom: 1px solid #49454F; }
.d1-top .face { margin-bottom: 16px; }
.d1-tabs { position: relative; flex: 1; display: flex; overflow-x: auto; scrollbar-width: none; height: 64px; }
.d1-tabs::-webkit-scrollbar { display: none; }
.d1-tab { all: unset; cursor: pointer; flex: none; min-width: 64px; padding: 0 12px; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #CAC4D0; font: 500 12.5px var(--font); letter-spacing: .01em; position: relative; border-radius: 12px 12px 0 0; }
.d1-tab:hover { background: rgba(230, 224, 233, .06); }
.d1-tab.on { color: #D0BCFF; }
.d1-tab.on .ms { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
.d1-ind { position: absolute; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: #D0BCFF; transition: left .5s var(--spring), width .5s var(--spring); }
.d1-trail { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
.m3-tonal { all: unset; cursor: pointer; height: 40px; padding: 0 14px 0 8px; border-radius: 20px; background: #4A4458; color: #E8DEF8; display: flex; align-items: center; gap: 8px; font: 500 13px var(--font); transition: filter .2s; }
.m3-tonal:hover { filter: brightness(1.12); }
.avs { display: flex; }
.avs .bloub + .bloub { margin-left: -7px; }
.m3-icon-btn { all: unset; cursor: pointer; width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: #CAC4D0; position: relative; transition: background .2s; }
.m3-icon-btn:hover { background: rgba(230,224,233,.08); }
.badge { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; border-radius: 8px; background: #F2B8B5; color: #601410; font: 700 10px var(--font, Inter); display: grid; place-items: center; padding: 0 4px; }
.d1-body { position: absolute; left: 16px; right: 16px; top: 88px; bottom: 16px; }
.d1-dialog { position: absolute; inset: 0; background: #141218; border-radius: 46px; transform: translateY(105%); transition: transform .6s var(--spring-soft); display: flex; flex-direction: column; z-index: 5; }
.d1-dialog.open { transform: none; }
.d1-bar { height: 64px; display: flex; align-items: center; gap: 6px; padding: 8px 22px 0 14px; }
.d1-bar h3 { flex: 1; margin: 0; font: 400 22px var(--font); }
.m3-text-btn { all: unset; cursor: pointer; height: 40px; padding: 0 16px; border-radius: 20px; color: #D0BCFF; font: 500 14px var(--font); display: grid; place-items: center; }
.m3-text-btn:hover { background: rgba(208,188,255,.08); }
.m3-filled-btn { all: unset; cursor: pointer; height: 40px; padding: 0 22px; border-radius: 20px; background: #D0BCFF; color: #381E72; font: 600 14px var(--font); display: grid; place-items: center; }
.d1-scroll { flex: 1; overflow-y: auto; padding: 4px 26px 22px; scrollbar-width: none; }
.d1-scroll::-webkit-scrollbar { display: none; }
.m3-chips { display: flex; gap: 8px; margin: 2px 0 14px; flex-wrap: wrap; }
.m3-chip { all: unset; cursor: pointer; height: 32px; padding: 0 14px 0 10px; border-radius: 8px; border: 1px solid #938F99; color: #CAC4D0; font: 500 13px var(--font); display: inline-flex; align-items: center; gap: 6px; transition: background .25s, border-color .25s; }
.m3-chip .ms { font-size: 18px; }
.m3-chip.on { background: #4A4458; border-color: transparent; color: #E8DEF8; }
.m3-chip:not(.on) .ms.chk { display: none; }
.m3-sec { font: 500 14px var(--font); color: #D0BCFF; margin: 14px 4px 6px; display: flex; justify-content: space-between; }
.m3-sec small { color: #938F99; font-weight: 400; }
.m3-li { display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 8px 0 14px; border-radius: 14px; background: #1D1B20; margin-bottom: 4px; user-select: none; touch-action: none; }
.m3-li .lead { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; background: #4A4458; color: #E8DEF8; flex: none; }
.m3-li .txt { flex: 1; min-width: 0; }
.m3-li .txt b { display: block; font: 500 15px var(--font); color: #E6E0E9; }
.m3-li .txt span { font: 400 12.5px var(--font); color: #CAC4D0; }
.m3-li .handle { color: #938F99; cursor: grab; width: 40px; height: 40px; display: grid; place-items: center; }
.m3-li.avail { background: transparent; }
.m3-li.avail .lead { background: #2B2930; color: #CAC4D0; }
.m3-li.dragging, .sortable .dragging { z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,.6); background: #36343B; }

/* =========================================================== D3 · M3 chips + bottom sheet */
.d3-top { position: absolute; left: 0; right: 0; top: 0; padding: 16px 20px 0 18px; display: flex; align-items: center; gap: 12px; height: 70px; }
.d3-chiprow { flex: 1; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px; mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 22px), transparent); }
.d3-chiprow::-webkit-scrollbar { display: none; }
.d3-chip { all: unset; cursor: pointer; flex: none; height: 34px; padding: 0 14px 0 10px; border-radius: 10px; border: 1px solid #49454F; color: #CAC4D0; font: 500 13.5px var(--font); display: inline-flex; align-items: center; gap: 7px; transition: background .3s, border-color .3s, color .3s, transform .4s var(--spring); }
.d3-chip .ms { font-size: 19px; }
.d3-chip:hover { background: rgba(230,224,233,.06); }
.d3-chip.on { background: #E8DEF8; color: #1D192B; border-color: transparent; }
.d3-chip.on .ms { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
.d3-chip:active { transform: scale(.95); }
.d3-assist { all: unset; cursor: pointer; flex: none; height: 34px; padding: 0 14px 0 10px; border-radius: 10px; background: #2B2930; color: #E6E0E9; font: 500 13px var(--font); display: inline-flex; align-items: center; gap: 7px; }
.d3-assist .ms { color: #D0BCFF; font-size: 19px; }
.d3-body { position: absolute; left: 16px; right: 16px; top: 82px; bottom: 16px; }
.d3-scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 4; }
.d3-scrim.open { opacity: 1; pointer-events: auto; }
.d3-sheet { position: absolute; left: 10px; right: 10px; bottom: 0; height: 84%; border-radius: 28px 28px 38px 38px; background: #1D1B20; transform: translateY(105%); transition: transform .6s var(--spring-soft); z-index: 5; padding: 0 22px 18px; display: flex; flex-direction: column; }
.d3-sheet.open { transform: none; }
.d3-grab { width: 32px; height: 4px; border-radius: 2px; background: #938F99; margin: 12px auto 10px; opacity: .6; }
.d3-sheet h3 { margin: 0 0 12px; font: 400 22px var(--font); display: flex; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid #938F99; border-radius: 20px; overflow: hidden; height: 36px; }
.seg button { all: unset; cursor: pointer; padding: 0 14px; font: 500 13px var(--font); color: #E6E0E9; display: flex; align-items: center; gap: 6px; border-left: 1px solid #938F99; transition: background .25s; }
.seg button:first-child { border-left: 0; }
.seg button.on { background: #4A4458; color: #E8DEF8; }
.seg button .ms { font-size: 18px; }
.seg button:not(.on) .ms { display: none; }
.d3-label { font: 500 12px var(--font); color: #938F99; letter-spacing: .06em; text-transform: uppercase; margin: 10px 2px 8px; }
.d3-wrap { display: flex; flex-wrap: wrap; gap: 8px; min-height: 36px; }
.input-chip { all: unset; cursor: grab; height: 34px; padding: 0 6px 0 10px; border-radius: 10px; background: #4A4458; color: #E8DEF8; font: 500 13.5px var(--font); display: inline-flex; align-items: center; gap: 7px; touch-action: none; user-select: none; }
.input-chip .ms { font-size: 19px; }
.input-chip .x { width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; }
.input-chip .x:hover { background: rgba(255,255,255,.12); }
.input-chip .x .ms { font-size: 17px; }
.sugg-chip { all: unset; cursor: pointer; height: 34px; padding: 0 14px 0 10px; border-radius: 10px; border: 1px solid #49454F; color: #CAC4D0; font: 500 13.5px var(--font); display: inline-flex; align-items: center; gap: 7px; transition: background .2s; }
.sugg-chip:hover { background: rgba(230,224,233,.06); }
.sugg-chip .ms { font-size: 19px; }
.sugg-chip .plus { color: #D0BCFF; }



/* =========================================================== the shared island header (same as the app) */
.hdr { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; align-items: center; padding: 0 22px 0 18px; gap: 12px; z-index: 8; }
.hdr .face { width: 44px; height: 40px; display: grid; place-items: center; }
.tabs { position: relative; flex: 1; min-width: 0; height: 30px; }
.tabrow { position: absolute; inset: 0; display: flex; gap: 4px; align-items: center; }
.sel { position: absolute; top: 0; height: 30px; border-radius: 15px; background: rgba(255,255,255,.14); transition: left .5s var(--spring), width .5s var(--spring); }
.tab { all: unset; cursor: pointer; position: relative; height: 30px; padding: 0 12px; border-radius: 15px; display: flex; align-items: center; gap: 6px; font: 600 13px Inter; color: rgba(255,255,255,.42); white-space: nowrap; transition: color .25s; touch-action: none; user-select: none; flex: none; }
.tab:hover { color: rgba(255,255,255,.75); }
.tab.on { color: #fff; }
.tab .ms { font-size: 17px; display: none; }
.tab.icon-only { padding: 0 8px; }
.tab.icon-only .ms { display: inline-block; }
.tab.icon-only span:last-child { display: none; }
.tab:not(.icon-only)::after { display: none !important; }
.island.customizing .tab { box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); background: rgba(255,255,255,.04); cursor: grab; animation: wob .34s ease-in-out infinite alternate; }
.island.customizing .tab:nth-child(2n) { animation-delay: -.17s; }
@keyframes wob { from { rotate: -1.4deg; } to { rotate: 1.4deg; } }
.team { all: unset; cursor: pointer; position: relative; height: 32px; padding: 0 10px 0 9px; border-radius: 16px; background: rgba(255,255,255,.08); display: flex; align-items: center; transition: background .2s; }
.team:hover { background: rgba(255,255,255,.16); }
.team .bloub + .bloub { margin-left: -4px; }
.team .bloub { transition: transform .45s var(--spring); }
.team:hover .bloub { transform: translateY(-3px); }
.team:hover .bloub:nth-child(2) { transition-delay: .04s; } .team:hover .bloub:nth-child(3) { transition-delay: .08s; } .team:hover .bloub:nth-child(4) { transition-delay: .12s; }
.team::before { content: ""; position: absolute; inset: 0; border-radius: 16px; box-shadow: inset 0 0 0 1.4px #FF9F0A; animation: needs 1.25s ease-in-out infinite alternate; }
@keyframes needs { from { opacity: .35 } to { opacity: .95 } }
.pen { all: unset; cursor: pointer; position: relative; width: 32px; height: 32px; border-radius: 16px; background: rgba(255,255,255,.1); display: grid; place-items: center; color: #fff; transition: background .25s, transform .4s var(--spring); }
.pen:hover { background: rgba(255,255,255,.18); }
.pen.on { background: #0A84FF; }
.pen .ms { font-size: 18px; }
[data-tip]:hover::after { content: attr(data-tip); position: absolute; top: calc(100% + 8px); left: 50%; translate: -50% 0; padding: 4px 9px; border-radius: 11px; background: #3A3A3C; font: 600 11.5px Inter; color: #fff; white-space: nowrap; pointer-events: none; z-index: 50; animation: tipIn .3s var(--spring); }
@keyframes tipIn { from { opacity: 0; transform: translateY(-4px) scale(.9); } }
.body { position: absolute; left: 16px; right: 16px; top: 66px; bottom: 16px; }

/* =========================================================== 1 · M3 full-screen dialog */
.island .d1-dialog { top: 60px; border-radius: 28px 28px 46px 46px; }
.island .d1-dialog .d1-bar h3 { font-family: 'Roboto Flex', sans-serif; }

/* =========================================================== 2 · M3 bottom sheet */
.island .d3-scrim { top: 60px; border-radius: 0 0 46px 46px; }
.island .d3-sheet { height: calc(100% - 72px); }

/* =========================================================== 3 · M3 selectable cards */
.m3c { position: absolute; left: 0; right: 0; top: 60px; bottom: 0; z-index: 5; background: #141218; border-radius: 28px 28px 46px 46px; padding: 12px 18px 18px; display: flex; flex-direction: column; gap: 12px; opacity: 0; transform: translateY(16px); pointer-events: none; transition: opacity .25s, transform .5s var(--spring-soft); }
.m3c.open { opacity: 1; transform: none; pointer-events: auto; }
.m3c-head { display: flex; align-items: center; gap: 12px; }
.m3c-head h3 { margin: 0; font: 400 22px 'Roboto Flex', sans-serif; color: #E6E0E9; }
.m3c-head small { font: 500 13px 'Roboto Flex'; color: #938F99; margin-left: 8px; }
.m3c-head .grow { flex: 1; display: flex; align-items: baseline; }

/* FLIP: animate elements (matched by data-id) from where they were to where they are after `mutate`. */
function flip(root, mutate, { stagger = 0 } = {}) {
  const before = new Map();
  root.querySelectorAll('[data-id]').forEach(e => before.set(e.dataset.flip || e.dataset.id, e.getBoundingClientRect()));
  mutate();
  let k = 0;

/* Drag to reorder inside a container: items with data-id; calls onDone(ids) on drop. */
function sortable(container, { axis = 'x', enabled = () => true, handle = null, onDone }) {
  let drag = null;
  container.addEventListener('pointerdown', e => {
    if (!enabled()) return;
    const item = e.target.closest('[data-id]');
    if (!item || !container.contains(item) || item.parentElement !== container) return;
    if (handle && !e.target.closest(handle)) return;
    if (e.target.closest('[data-nodrag]')) return;
    drag = { item, x0: e.clientX, y0: e.clientY, moved: false, ox: 0, oy: 0 };
    item.setPointerCapture(e.pointerId);
  });
  container.addEventListener('pointermove', e => {
    if (!drag) return;
    const { item } = drag;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    if (!drag.moved) { drag.moved = true; item.classList.add('dragging'); item.style.transition = 'none'; }
    item.style.transform = `translate(${axis === 'y' ? 0 : dx - drag.ox}px, ${axis === 'x' ? 0 : dy - drag.oy}px) scale(1.06)`;
    const rect = item.getBoundingClientRect();
    const mid = axis === 'x' ? rect.left + rect.width / 2 : rect.top + rect.height / 2;
    const sibs = [...container.children].filter(s => s !== item && s.dataset.id);
    for (const s of sibs) {
      const r = s.getBoundingClientRect(), c = axis === 'x' ? r.left + r.width / 2 : r.top + r.height / 2;

      if ((after && mid > c) || (!after && mid < c)) {

        const others = new Map(sibs.map(o => [o, o.getBoundingClientRect()]));
        container.insertBefore(item, after ? s.nextSibling : s);
        const now = item.getBoundingClientRect();
        drag.ox += now.left - before.left; drag.oy += now.top - before.top;
        item.style.transform = `translate(${axis === 'y' ? 0 : dx - drag.ox}px, ${axis === 'x' ? 0 : dy - drag.oy}px) scale(1.06)`;
        for (const [o, r0] of others) {
          const r1 = o.getBoundingClientRect();
          o.animate([{ transform: `translate(${r0.left - r1.left}px,${r0.top - r1.top}px)` }, { transform: 'none' }], { duration: 420, easing: SPRING() });
        }
        break;
      }
    }
  });
  const end = () => {
    if (!drag) return;
    const { item, moved } = drag;
    drag = null;
    if (!moved) return;
    const t = item.style.transform;

    item.animate([{ transform: t }, { transform: 'none' }], { duration: 450, easing: SPRING() });

    item.addEventListener('click', ev => { ev.stopPropagation(); ev.preventDefault(); }, { capture: true, once: true });
    onDone([...container.children].filter(s => s.dataset.id).map(s => s.dataset.id));
  };
  container.addEventListener('pointerup', end);
  container.addEventListener('pointercancel', end);
}

/* springs, never durations (PLAN.md) */
class Spr {
  constructor(v = 0, k = 180, d = 16) { this.v = v; this.t = v; this.vel = 0; this.k = k; this.d = d; }
  step(dt) { const a = this.k * (this.t - this.v) - this.d * this.vel; this.vel += a * dt; this.v += this.vel * dt; return this.v; }
  snap(v) { this.v = this.t = v; this.vel = 0; }
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const textW = (() => { const c = document.createElement('canvas').getContext('2d'); return (t, f) => { c.font = f; return c.measureText(t).width; }; })();
const R = 56;
const ease = u => u < .5 ? 4 * u * u * u : 1 - (-2 * u + 2) ** 3 / 2;

/* something with x/y springs follows a curved path; the springs give it weight and a soft overshoot */
function startPath(o, x, y, arc = -40, dur, extra = {}) {
  o.path?.res();
  const x0 = o.x.t, y0 = o.y.t, d = Math.hypot(x - x0, y - y0);
  dur = dur ?? Math.max(260, Math.min(700, d * 1.2));
  return new Promise(res => { o.path = { x0, y0, cx: (x0 + x) / 2, cy: (y0 + y) / 2 + arc, x1: x, y1: y, t0: performance.now(), dur, res, ...extra }; });
}
function pathStep(o, now) {
  const p = o.path;
  if (!p) return;
  const u = Math.min(1, (now - p.t0) / p.dur), e = ease(u);
  o.x.t = (1 - e) ** 2 * p.x0 + 2 * (1 - e) * e * p.cx + e * e * p.x1;
  o.y.t = (1 - e) ** 2 * p.y0 + 2 * (1 - e) * e * p.cy + e * e * p.y1;
  if (u >= 1 && (Math.hypot(o.x.v - p.x1, o.y.v - p.y1) < 4 || now - p.t0 > p.dur + 450)) { o.path = null; p.res(); }
}

/* ------------------------------------------------------------ Bloub: a soft ball on springs */
class Bloub {
  constructor(island, { moons = false } = {}) {
    const el = this.el = document.createElement('div');
    el.className = 'bb';
    el.innerHTML = BLOUB_SVG;
    island.appendChild(el);
    this.svg = el.querySelector('svg');
    this.body = this.svg.querySelector('[data-body]');
    this.lookG = this.svg.querySelector('[data-look]');
    this.blinkG = this.svg.querySelector('[data-blink]');
    this.tintEl = this.svg.querySelector('[data-tint]');
    this.moons = moons ? [0, 1].map(() => { const m = document.createElement('span'); m.className = 'bb-moon'; island.appendChild(m); return m; }) : [];
    this.s = {
      x: new Spr(0, 300, 27), y: new Spr(0, 300, 27), z: new Spr(.333, 220, 24), hop: new Spr(0, 230, 13),
      sx: new Spr(1, 340, 13), sy: new Spr(1, 340, 13), lean: new Spr(0, 150, 12), roll: new Spr(0, 320, 30),
      ex: new Spr(0, 260, 22), ey: new Spr(0, 260, 22), blink: new Spr(1, 1100, 45), tint: new Spr(0, 90, 16),
    };
    this.ma = 0; this.nextBlink = 0; this.nextWander = 0; this.wander = { x: 0, y: 0 }; this.prevHop = 0; this.prevXt = 0;
  }
  get x() { return this.s.x.v; } get y() { return this.s.y.v; } get r() { return R * this.s.z.v; }
  snap(x, y, z) { this.s.x.snap(x); this.s.y.snap(y); this.s.z.snap(z); this.prevXt = x; }
  show(on) { this.el.classList.toggle('show', on); this.moons.forEach(m => m.style.opacity = on ? 1 : 0); this.shown = on; }
  moveTo(x, y, { size, arc = -40, dur, roll = false } = {}) {
    if (size != null) this.s.z.t = size;
    if (!roll) this.squash(.9, 1.06);
    return startPath(this.s, x, y, arc, dur, { roll });
  }
  squash(sy, sx) { this.s.sy.v = sy; this.s.sx.v = sx; }
  hop(p = 1) { const S = this.s; this.squash(.84, 1.12); setTimeout(() => { S.hop.vel = -300 * p; S.sy.vel = 3.2; S.sx.vel = -2.4; }, 90); }
  mood(m, ms) { this.svg.dataset.mood = m; clearTimeout(this.mt); if (ms) this.mt = setTimeout(() => this.svg.dataset.mood = '', ms); }
  shakeHead() { const S = this.s; S.lean.vel = 380; setTimeout(() => S.lean.vel = -380, 140); setTimeout(() => S.lean.vel = 260, 280); }
  tint(c) { if (c) this.tintEl.setAttribute('fill', c); this.s.tint.t = c ? .8 : 0; }
  blinkNow() { const S = this.s; S.blink.t = .05; setTimeout(() => S.blink.t = 1, 95); }
  update(now, dt, pointer) {
    const S = this.s, p = S.path;
    pathStep(S, now);
    if (p?.roll) S.roll.t += (S.x.t - this.prevXt) / Math.max(4, R * S.z.v) * 57.3;
    if (p?.roll && !S.path) S.roll.t = Math.round(S.roll.t / 360) * 360;   // stops upright
    this.prevXt = S.x.t;
    // eyes: what it's busy with, else you, else a look around
    let L = typeof this.lookAt === 'function' ? this.lookAt() : this.lookAt;
    if (!L && pointer && now - pointer.t < 1400) L = pointer;
    if (!L) {
      if (now > this.nextWander) { this.wander = { x: (Math.random() * 2 - 1) * 170, y: (Math.random() * 2 - 1) * 90 }; this.nextWander = now + 1500 + Math.random() * 2200; }
      L = { x: S.x.v + this.wander.x, y: S.y.v + this.wander.y };
    }
    const dx = L.x - S.x.v, dy = L.y - S.y.v, d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 150);
    S.ex.t = dx / d * 7 * k; S.ey.t = dy / d * 6 * k;
    S.lean.t = S.path && !S.path.roll ? Math.max(-14, Math.min(14, S.x.vel / 45)) : this.lookAt ? Math.max(-8, Math.min(8, dx / 30)) : 0;
    if (now > this.nextBlink) {
      this.blinkNow();
      if (Math.random() < .3) setTimeout(() => this.blinkNow(), 230);
      this.nextBlink = now + 2200 + Math.random() * 3200;
    }
    for (const s of Object.values(S)) if (s instanceof Spr) s.step(dt);
    if (this.prevHop < -2 && S.hop.v >= -2 && S.hop.vel > 80) this.squash(.86, 1.1);
    this.prevHop = S.hop.v;
    const t = now / 1000, calm = S.path ? .2 : 1, fl = Math.sin(t * 2.1) * 2.4 * calm, br = 1 + Math.sin(t * 2.1 + 1.2) * .014 * calm;
    const rolling = S.path?.roll, sp = rolling ? 0 : Math.hypot(S.x.vel, S.y.vel), st = Math.min(.28, sp / 2600), ang = Math.atan2(S.y.vel, S.x.vel) * 57.3;
    this.body.setAttribute('transform',
      `translate(0 ${(fl + S.hop.v).toFixed(2)}) rotate(${(S.lean.v + S.roll.v).toFixed(2)} 60 60) ` +
      `rotate(${ang.toFixed(1)} 60 60) translate(60 60) scale(${(1 + st).toFixed(3)} ${(1 - st * .55).toFixed(3)}) translate(-60 -60) rotate(${(-ang).toFixed(1)} 60 60) ` +
      `translate(60 116) scale(${(S.sx.v * br).toFixed(3)} ${(S.sy.v / br).toFixed(3)}) translate(-60 -116)`);
    this.lookG.setAttribute('transform', `translate(${S.ex.v.toFixed(2)} ${S.ey.v.toFixed(2)})`);
    this.blinkG.style.transform = `scaleY(${Math.max(.05, Math.min(1.1, S.blink.v)).toFixed(3)})`;
    this.tintEl.setAttribute('opacity', Math.max(0, S.tint.v).toFixed(3));
    this.el.style.transform = `translate(${(S.x.v - 60).toFixed(2)}px, ${(S.y.v - 60).toFixed(2)}px) scale(${S.z.v.toFixed(3)})`;
    this.ma += dt * .7;
    this.moons.forEach((m, i) => {
      const a = this.ma + i * Math.PI, z = S.z.v, front = Math.sin(a) > 0;
      m.style.transform = `translate(${(S.x.v + Math.cos(a) * 92 * z).toFixed(1)}px, ${(S.y.v + (12 + Math.sin(a) * 34 - Math.cos(a) * 10) * z).toFixed(1)}px) scale(${front ? 1 : .78})`;
      m.style.zIndex = front ? 51 : 48;
    });
  }
}

/* ------------------------------------------------------------ a tab in flight */
class Chip {
  constructor(island, t, rect, r0) {
    const el = this.el = document.createElement('div');
    el.className = 'fly-chip tn';
    el.style.setProperty('--c', t.c);
    el.innerHTML = `<span class="ms">${t.m}</span><span>${t.name}</span>`;
    island.appendChild(el);
    this.x = new Spr(rect.x + rect.w / 2, 320, 28); this.y = new Spr(rect.y + rect.h / 2, 320, 28);
    this.w = new Spr(rect.w, 220, 24); this.h = new Spr(rect.h, 220, 24); this.r = new Spr(r0, 220, 24); this.s = new Spr(1, 260, 22);
  }
  size({ w, h, r, s }) { if (w != null) this.w.t = w; if (h != null) this.h.t = h; if (r != null) this.r.t = r; if (s != null) this.s.t = s; }
  flyTo(x, y, o = {}) { this.size(o); return startPath(this, x, y, o.arc ?? -40, o.dur); }
  update(now, dt) {
    if (this.follow) { const p = this.follow(); this.x.t = p.x; this.y.t = p.y; }
    pathStep(this, now);
    for (const s of [this.x, this.y, this.w, this.h, this.r, this.s]) s.step(dt);
    const sp = Math.hypot(this.x.vel, this.y.vel), st = Math.min(.25, sp / 3000), ang = Math.atan2(this.y.vel, this.x.vel) * 57.3, s = Math.max(0, this.s.v);
    const w = Math.max(0, this.w.v), h = Math.max(0, this.h.v);
    Object.assign(this.el.style, { width: w.toFixed(1) + 'px', height: h.toFixed(1) + 'px', borderRadius: Math.max(0, this.r.v).toFixed(1) + 'px',
      transform: `translate(${(this.x.v - w / 2).toFixed(1)}px, ${(this.y.v - h / 2).toFixed(1)}px) rotate(${ang.toFixed(1)}deg) scale(${((1 + st) * s).toFixed(3)}, ${((1 - st * .5) * s).toFixed(3)}) rotate(${(-ang).toFixed(1)}deg)` });
  }
  kill(fade) {
    this.dead = true;
    if (!fade) return this.el.remove();
    this.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' }).onfinish = () => this.el.remove();
  }
}

/* ------------------------------------------------------------ what every version shares: tiles, queue, open/close */
function Version(cfg) {
  return {
    ...cfg,
    mount(el, app) {
      this.app = app; this.island = el; this.dead = false; this.jobs = []; this.busy = false; this.isOpen = false; this.chips = new Set(); this.free = false;
      const g = this.g = document.createElement('div');
      g.className = 'grok qt';
      let stars = '';
      for (let i = 0; i < 28; i++) stars += `<i style="left:${(Math.random() * 100).toFixed(1)}%;top:${(Math.random() * 100).toFixed(1)}%;animation-delay:-${(Math.random() * 4).toFixed(2)}s;animation-duration:${(3 + Math.random() * 4).toFixed(1)}s"></i>`;
      const tiles = TABS.map(t => `<button class="tile tn rip" data-t="${t.id}" style="--c:${t.c}"><span class="fill"></span><span class="ms ic">${t.m}</span><span class="qt2"><b>${t.name}</b><span class="sub"><span></span></span></span></button>`).join('');
      g.innerHTML = `<div class="gk-stars">${stars}</div>` + (cfg.layout === 'full'
        ? `<div class="vf-top"><div class="gk-cap">Tap a tile to pin it <span class="cnt" data-cnt><span></span></span><span class="vnote" data-note></span></div><button class="gk-done3" data-done>Done</button></div>
           <div class="tiles full4" data-pills>${tiles}</div>`
        : `<div class="gk-left"><div class="gk-cap">Tab library <span class="cnt" data-cnt><span></span></span></div>
             <div class="gk-orb" data-orb><span class="gk-floor" data-floor></span></div>
             <div class="vnote" data-note>Tap a tile to pin it</div><button class="gk-done3" data-done>Done</button></div>
           <div class="gk-pills tiles" data-pills>${tiles}</div>`);
      el.appendChild(g);
      this.noteDefault = g.querySelector('[data-note]').textContent;
      this.bloub = new Bloub(el, { moons: cfg.moons });
      cfg.setup?.call(this);
      g.querySelector('[data-done]').onclick = () => this.close();
      g.querySelectorAll('.tile').forEach(tile => {
        tile.onclick = () => this.request(tile.dataset.t, tile);
        tile.onpointerenter = () => this.hoverEl = tile;
        tile.onpointerleave = () => { if (this.hoverEl === tile) this.hoverEl = null; };
      });
      el.addEventListener('pointermove', e => { const I = el.getBoundingClientRect(); this.pointer = { x: e.clientX - I.left, y: e.clientY - I.top, t: performance.now() }; });
      this.bloub.el.onclick = () => this.poke();
      let last = performance.now();
      const frame = now => {
        if (this.dead) return;
        const dt = Math.min(.033, (now - last) / 1000); last = now;
        const B = this.bloub;
        B.lookAt = this.focus || (this.hoverEl && !this.busy ? this.center(this.hoverEl) : null);
        cfg.frame?.call(this, now, dt);
        B.update(now, dt, this.pointer);
        for (const c of this.chips) { if (c.dead) this.chips.delete(c); else c.update(now, dt); }
        const floor = g.querySelector('[data-floor]');
        if (floor && this.isOpen) {
          const h = this.home(), away = Math.min(1, Math.hypot(B.x - h.x, B.y - h.y) / 70), lift = Math.max(0, -B.s.hop.v) / 40;
          floor.style.opacity = ((1 - away) * (1 - Math.min(.7, lift))).toFixed(2);
          floor.style.transform = `scale(${(1 - Math.min(.5, lift)).toFixed(3)})`;
        }
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    },
    unmount() { this.dead = true; },

    rel(el) { const r = el.getBoundingClientRect(), I = this.island.getBoundingClientRect(); return { x: r.left - I.left, y: r.top - I.top, w: r.width, h: r.height }; },
    center(el) { const r = this.rel(el); return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; },
    home() { return this.center(this.g.querySelector('[data-orb]')); },
    face() { return this.center(this.island.querySelector('.hdr .face')); },
    tabEl(id) { return this.island.querySelector(`.tab[data-id="${id}"]`); },
    chip(t, rect, r0) { const c = new Chip(this.island, t, rect, r0); this.chips.add(c); return c; },
    hiddenNewTab(id) { const tab = this.tabEl(id); tab.getAnimations().forEach(a => a.cancel()); tab.style.opacity = 0; return tab; },
    reveal(tab, t) {
      tab.style.opacity = '';
      tab.animate([{ transform: 'scale(1.25)', background: hex(t.c, .55), color: '#fff' }, { transform: 'none', background: 'rgba(255,255,255,0)' }], { duration: 700, easing: SPRING() });
      this.island.style.setProperty('--glow', t.c);
    },
    dip(tile) { tile.animate([{ transform: 'none' }, { transform: 'translateY(3px) scale(.96)' }, { transform: 'none' }], { duration: 380, easing: 'ease-out' }); },
    tabW(t) { return textW(t.name, '600 13px Inter') + 47; },
    note(text, warn) {
      const n = this.g.querySelector('[data-note]');
      n.textContent = text; n.className = 'vnote' + (warn ? ' warn' : '');
      n.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: 300, easing: 'ease-out' });
      clearTimeout(this.noteT);
      this.noteT = setTimeout(() => { n.textContent = this.noteDefault; n.className = 'vnote'; }, 2200);
    },
    poke() {
      if (this.busy || !this.isOpen) return;
      const S = this.bloub.s;
      this.bloub.hop(.8); S.roll.t += 360; this.bloub.mood('wide', 700);
    },
    refuse(tile, text) { shake(tile); this.bloub.mood('surprised', 900); this.bloub.shakeHead(); this.note(text, true); },

    request(id, tile) {
      if (this.closing || !this.isOpen) return;
      const q = this.jobs.findIndex(j => j.id === id);
      if (q >= 0) { this.jobs.splice(q, 1); tile.classList.remove('queued'); return; }
      if (this.current?.id === id) return;
      const pinned = state.enabled.includes(id);
      let n = state.enabled.length;
      for (const j of [this.current, ...this.jobs]) if (j && !j.applied) n += j.pin ? 1 : -1;
      if (!pinned && n >= MAX) return this.refuse(tile, 'The bar is full');
      if (pinned && n <= 1) return this.refuse(tile, 'Keep at least one tab');
      tile.classList.add('queued');
      this.jobs.push({ id, tile, pin: !pinned });
      if (!this.busy) this.run();
    },
    async run() {
      this.busy = true;
      this.bloub.el.classList.add('busy');
      while (this.jobs.length) {
        const j = this.current = this.jobs.shift();
        j.tile.classList.remove('queued'); j.tile.classList.add('working');
        try { await (j.pin ? cfg.pin : cfg.unpin).call(this, j, T[j.id]); } catch (e) { console.error(e); }
        j.tile.classList.remove('working');
        this.focus = null;
        this.current = null;
        this.sync();
      }
      if (cfg.afterJobs && !this.closing) await cfg.afterJobs.call(this);
      this.busy = false;
      this.bloub.el.classList.remove('busy');
      this.idleRes?.(); this.idleRes = null;
    },

    /* Bloub buds off the header to start, and merges back into it at the end */
    async open() {
      const g = this.g, island = this.island, B = this.bloub;
      this.closing = false;
      island.style.setProperty('--glow', '#0A84FF');
      this.sync(true);
      g.classList.add('open');
      this.app.setCustomizing(true);
      this.isOpen = true;
      g.querySelectorAll('.tile').forEach((p, i) => p.animate([{ opacity: 0, translate: '0 14px', scale: '.9' }, { translate: '0 0', scale: '1' }], { duration: 650, delay: 120 + i * 22, easing: SPRING(), fill: 'backwards' }));
      const f = this.face();
      island.querySelector('.hdr .face').animate([{ transform: 'none' }, { transform: 'scale(1.3, .75)' }, { transform: 'scale(.92, 1.12)' }], { duration: 200, easing: 'ease-out' });
      await wait(180);
      island.classList.add('bloub-out');
      B.snap(f.x, f.y, .333);
      B.show(true);
      B.mood('wide', 900);
      await cfg.enter.call(this);
      this.free = true;
    },
    async close() {
      if (this.closing || !this.isOpen) return;
      this.closing = true;
      if (this.busy) await new Promise(r => this.idleRes = r);
      const B = this.bloub, f = this.face();
      this.free = false;
      await B.moveTo(f.x, f.y, { size: .333, arc: cfg.layout === 'full' ? -16 : -50, dur: cfg.layout === 'full' ? 640 : 520, roll: cfg.layout === 'full' });
      B.show(false);
      this.island.classList.remove('bloub-out');
      this.island.querySelector('.hdr .face').animate([{ transform: 'scale(1.35, .72)' }, { transform: 'scale(.92, 1.1)' }, { transform: 'none' }], { duration: 560, easing: SPRING() });
      this.isOpen = false;
      this.g.classList.remove('open');
      this.app.setCustomizing(false);
    },

    sync(first) {
      const g = this.g;
      g.querySelectorAll('.tile').forEach(p => {
        if (p.classList.contains('working')) return;
        const i = state.enabled.indexOf(p.dataset.t), on = i >= 0, was = p.classList.contains('on');
        p.classList.toggle('on', on);
        const sub = p.querySelector('.sub span'), txt = on ? `Pinned · ${i + 1}` : 'Off';
        if (sub.textContent !== txt) {
          sub.textContent = txt;
          if (!first) sub.animate([{ transform: 'translateY(100%)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, easing: SPRING() });
        }
        if (!first && on !== was) p.querySelector('.ic').animate([{ transform: 'none' }, { transform: on ? 'scale(1.35) rotate(-12deg)' : 'scale(.7)' }, { transform: 'none' }], { duration: 520, easing: 'ease-out' });
      });
      g.querySelector('[data-pills]').classList.toggle('full', state.enabled.length >= MAX);
      const cnt = g.querySelector('[data-cnt] span'), ct = `${state.enabled.length} / ${MAX}`;
      if (cnt.textContent !== ct) {
        const up = parseInt(ct) > parseInt(cnt.textContent || '0');
        cnt.textContent = ct;
        if (!first) cnt.animate([{ transform: `translateY(${up ? 100 : -100}%)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, easing: SPRING() });
      }
    },
  };
}

/* ============================================================ 1 · Magnet: Bloub stays put, pulls the tab in, pops it into the bar */
const Magnet = Version({
  name: 'Magnet', layout: 'side', moons: true,
  title: 'Magnet: Bloub pulls, then pops',
  text: 'Bloub never leaves its spot. Tap a tile and it draws the tab in like a magnet, swallowing it with a glow of that tab\'s colour, then pops it straight up into its slot in the bar. Tap a pinned tile and it pulls the tab out of the bar and drops it back where it came from.',
  hint: ['Tap tiles (queue several)', 'Tap a pinned tile to send it back', 'Drag the dashed tabs to reorder', 'Poke Bloub'],
  async enter() {
    const h = this.home(), B = this.bloub;

  async pin(j, t) {

    B.mood('wide');

    this.focus = () => ({ x: c.x.v, y: c.y.v });
    await c.flyTo(B.x, B.y, { w: 56, h: 26, r: 13, s: .2, arc: -30, dur: 520 });
    c.kill();
    S.sx.t = S.sy.t = 1;
    B.squash(.8, 1.18); B.tint(t.c); B.mood('');
    await wait(240);
    const tr = this.rel(tile);
    this.focus = this.center(tile);
    B.squash(.84, 1.12);
    await wait(100);
    B.hop(.3);
    const c2 = this.chip(t, { x: B.x - 30, y: B.y - 14, w: 60, h: 28 }, 14);
    c2.s.snap(.25);
    await c2.flyTo(tr.x + tr.w / 2, tr.y + tr.h / 2, { w: tr.w, h: tr.h, r: 27, s: 1, arc: -60, dur: 520 });
    c2.kill(true); B.tint(null); this.dip(tile);
    tile.style.setProperty('--rx', '50%'); tile.style.setProperty('--ry', '50%');
    await wait(120);
  },
});

/* ============================================================ 2 · Buddy: Bloub sits in the tab bar and catches tabs */
const Buddy = Version({
  name: 'Buddy', layout: 'full', ghostClass: 'seat',
  title: 'Buddy: Bloub sits in your tab bar',
  text: 'Bloub lives in the tab bar, in the next free slot. Tap a tile and the tab hops up to it; Bloub catches it, sets it down and rolls one slot over to make room. Tap a pinned tile and Bloub hops onto that tab and stomps it back down into its tile, then rolls home.',
  hint: ['Tap tiles (queue several)', 'Tap a pinned tile: Bloub stomps it out', 'Drag the dashed tabs to reorder', 'Poke Bloub'],
  seat() { const gh = this.island.querySelector('.ghost'); return gh ? this.center(gh) : this.face(); },
  frame() {
    // when it's free, Bloub sits in its seat and rides along as the bar reflows
    const B = this.bloub;
    if (this.free && !this.busy && !B.s.path) { const s = this.seat(); B.s.x.t = s.x; B.s.y.t = s.y; }
  },
  async enter() {
    const s = this.seat();
    await this.bloub.moveTo(s.x, s.y, { size: .3, arc: -14, dur: 760, roll: true });
    this.bloub.squash(.8, 1.15);
  },
  async afterJobs() {
    const s = this.seat();
    await this.bloub.moveTo(s.x, s.y, { arc: -16, dur: 420, roll: true });
    this.free = true;
  },
  async pin(j, t) {
    const B = this.bloub, tile = j.tile, tr = this.rel(tile);
    this.free = false;
    tile.style.setProperty('--rx', '50%'); tile.style.setProperty('--ry', '50%');
    tile.classList.add('on'); this.dip(tile);
    const c = this.chip(t, tr, 18);
    this.focus = () => ({ x: c.x.v, y: c.y.v });
    B.mood('wide');
    await c.flyTo(B.x, B.y, { w: this.tabW(t), h: 30, r: 15, arc: -70, dur: 600 });
    B.squash(.66, 1.3); B.mood('');                                 // catch!
    this.app.add(j.id); j.applied = true;
    const tab = this.hiddenNewTab(j.id), tb = this.rel(tab);
    const nx = tb.x + tb.w + 4 + 19;
    B.moveTo(nx, B.y, { arc: 0, dur: 420, roll: true });          // rolls over to make room
    await c.flyTo(tb.x + tb.w / 2, tb.y + tb.h / 2, { w: tb.w, h: tb.h, r: 15, arc: 0, dur: 320 });
    this.reveal(tab, t); c.kill(true);
    await wait(260);
  },
  async unpin(j, t) {
    const B = this.bloub, tile = j.tile;
    this.free = false;
    let tab = this.tabEl(j.id), tb = this.rel(tab);
    this.focus = this.center(tab);
    B.mood('wide');
    await B.moveTo(tb.x + tb.w / 2, tb.y + tb.h / 2 - 12, { arc: -34, dur: 440, roll: true });
    B.squash(.6, 1.34);                                           // stomp
    tab = this.tabEl(j.id); tb = this.rel(tab);
    const c = this.chip(t, tb, 15);
    tab.style.opacity = 0;
    this.app.remove(j.id); j.applied = true;
    B.mood('');
    const tr = this.rel(tile);
    this.focus = () => ({ x: c.x.v, y: c.y.v });
    await c.flyTo(tr.x + tr.w / 2, tr.y + tr.h / 2, { w: tr.w, h: tr.h, r: 27, arc: -40, dur: 560 });
    c.kill(true); this.dip(tile);
    tile.style.setProperty('--rx', '50%'); tile.style.setProperty('--ry', '50%');
    await wait(80);
  },
});

/* ============================================================ 3 · Ink: a liquid arm reaches out, fetches, snaps back */
const N_GOO = 48;
const Ink = Version({
  name: 'Ink', layout: 'side',
  title: 'Ink: Bloub reaches out',
  text: 'Bloub stretches out a liquid arm, like ink. It reaches the tile, picks up the tab, carries it up into the bar and snaps back into its body with a wobble. To unpin, it reaches into the bar, plucks the tab and puts it back on its tile. Bloub stays put the whole time.',
  hint: ['Tap tiles (queue several)', 'Tap a pinned tile to send it back', 'Drag the dashed tabs to reorder', 'Poke Bloub'],
  setup() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'goo');
    svg.innerHTML = `<g filter="url(#goo2)" fill="#d7e3f1">${'<circle r="0"/>'.repeat(N_GOO)}</g>`;
    this.island.appendChild(svg);
    this.arm = { x: new Spr(0, 260, 24), y: new Spr(0, 260, 24), r: new Spr(0, 220, 20), dots: [...svg.querySelectorAll('circle')], out: false };
  },
  frame(now, dt) {
    const B = this.bloub, A = this.arm, bx = B.x, by = B.y + B.r * .25;
    if (!A.out && !A.path) { A.x.t = bx; A.y.t = by; }
    pathStep(A, now);
    for (const s of [A.x, A.y, A.r]) s.step(dt);
    const tx = A.x.v, ty = A.y.v, len = Math.hypot(tx - bx, ty - by);
    const sag = Math.min(55, len * .22), cx = (bx + tx) / 2, cy = (by + ty) / 2 + sag;
    const base = B.r * .42, thin = Math.max(.6, Math.min(1, 260 / Math.max(1, len))), tip = Math.max(0, A.r.v);
    A.dots.forEach((d, i) => {
      const u = i / (N_GOO - 1), x = (1 - u) ** 2 * bx + 2 * (1 - u) * u * cx + u * u * tx, y = (1 - u) ** 2 * by + 2 * (1 - u) * u * cy + u * u * ty;
      const r = len < 6 ? 0 : i === N_GOO - 1 ? tip : Math.max(6.5, (base * (1 - u) + tip * .8 * u) * thin);
      d.setAttribute('cx', x.toFixed(1)); d.setAttribute('cy', y.toFixed(1)); d.setAttribute('r', Math.max(0, r).toFixed(1));
    });
  },
  reach(x, y, o = {}) { this.arm.out = true; this.arm.r.t = 13; return startPath(this.arm, x, y, o.arc ?? -50, o.dur); },
  async retract() {
    const A = this.arm, B = this.bloub;
    A.r.t = 0;
    await startPath(A, B.x, B.y + B.r * .25, 20, 360);
    A.out = false;
    B.squash(.86, 1.12);                                         // absorbs it, with a wobble
  },
  async enter() {
    const h = this.home(), B = this.bloub;
    await B.moveTo(h.x, h.y, { size: .92, arc: -20, dur: 560 });
    B.squash(.74, 1.2);
    this.arm.x.snap(B.x); this.arm.y.snap(B.y);
  },
  async pin(j, t) {
    const B = this.bloub, A = this.arm, tile = j.tile, tr = this.rel(tile);
    this.focus = () => ({ x: A.x.v, y: A.y.v });
    B.mood('wide'); B.squash(.9, 1.08);
    await this.reach(tr.x + tr.w / 2, tr.y + tr.h / 2, { dur: 520, arc: -40 });
    A.r.v = 19;                                                   // splat on the tile
    tile.style.setProperty('--rx', '50%'); tile.style.setProperty('--ry', '50%');
    tile.classList.add('on'); this.dip(tile);
    const c = this.chip(t, tr, 18);
    c.follow = () => ({ x: A.x.v, y: A.y.v - 4 });
    c.size({ w: this.tabW(t), h: 30, r: 15 });
    await wait(220);
    B.mood('');
    this.app.add(j.id); j.applied = true;
    const tab = this.hiddenNewTab(j.id), tb = this.rel(tab);
    await this.reach(tb.x + tb.w / 2, tb.y + tb.h / 2 + 4, { dur: 640, arc: -60 });
    c.follow = null;
    await c.flyTo(tb.x + tb.w / 2, tb.y + tb.h / 2, { w: tb.w, h: tb.h, r: 15, arc: 0, dur: 160 });
    this.reveal(tab, t); c.kill(true);
    await this.retract();
  },
  async unpin(j, t) {
    const B = this.bloub, A = this.arm, tile = j.tile;
    let tab = this.tabEl(j.id), tb = this.rel(tab);
    this.focus = () => ({ x: A.x.v, y: A.y.v });
    B.mood('wide'); B.squash(.9, 1.08);
    await this.reach(tb.x + tb.w / 2, tb.y + tb.h / 2 + 4, { dur: 560, arc: -50 });
    A.r.v = 17;
    tab = this.tabEl(j.id); tb = this.rel(tab);
    const c = this.chip(t, tb, 15);
    c.follow = () => ({ x: A.x.v, y: A.y.v - 2 });
    tab.style.opacity = 0;
    this.app.remove(j.id); j.applied = true;
    await wait(160);
    B.mood('');
    const tr = this.rel(tile);
    await this.reach(tr.x + tr.w / 2, tr.y + tr.h / 2, { dur: 600, arc: -40 });
    c.follow = null;
    await c.flyTo(tr.x + tr.w / 2, tr.y + tr.h / 2, { w: tr.w, h: tr.h, r: 27, arc: 0, dur: 200 });
    c.kill(true); this.dip(tile);
    tile.style.setProperty('--rx', '50%'); tile.style.setProperty('--ry', '50%');
    await this.retract();
  },
});

/* ============================================================ shell */
const DESIGNS = [Magnet, Buddy, Ink];
function choose(i) {
  const d = DESIGNS[i];
  document.querySelectorAll('#picker button').forEach((b, k) => b.classList.toggle('on', k === i));
  $('#dTitle').textContent = d.title;
  $('#dText').textContent = d.text;
  $('#hint').innerHTML = d.hint.map(h => `<span>• ${h}</span>`).join('');
  App.build(d);
  try { localStorage.setItem('island-bloub-v', i); } catch {}
  setTimeout(() => d.open(), 450);
}
$('#picker').innerHTML = DESIGNS.map((d, i) => `<button>${d.name}<kbd>${i + 1}</kbd></button>`).join('');
document.querySelectorAll('#picker button').forEach((b, i) => b.onclick = () => choose(i));
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; const n = +e.key; if (n >= 1 && n <= 3) choose(n - 1); });
let start = 0;
try { start = +(localStorage.getItem('island-bloub-v') || 0); } catch {}
if (/^#[1-3]$/.test(location.hash)) start = +location.hash[1] - 1;
document.fonts.ready.then(() => choose(Math.min(2, Math.max(0, start))));
</script>
</body>
