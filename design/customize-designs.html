<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customize Tabs Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&family=Inter:wght@400..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-25..200&display=block" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root {
  --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
  --spring-soft: linear(0, 0.06 3%, 0.23 7.4%, 0.55 14.6%, 0.81 22.4%, 0.94 29.6%, 1.01 37.4%, 1.03 44.6%, 1.02 55%, 1);
  --page: #e9e6f2;
  --ink: #1d1b22;
}
@property --glow { syntax: '<color>'; inherits: true; initial-value: #2f6bff; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: var(--ink); overflow-x: hidden;
  background:
    radial-gradient(60% 50% at 12% 18%, #9fb0ff 0%, transparent 60%),
    radial-gradient(50% 45% at 88% 14%, #ffa9cf 0%, transparent 60%),
    radial-gradient(55% 50% at 72% 88%, #ffd29b 0%, transparent 62%),
    radial-gradient(50% 50% at 18% 90%, #95e8da 0%, transparent 60%),
    var(--page);
}
.page { max-width: 1100px; margin: 0 auto; padding: 22px 16px 60px; display: flex; flex-direction: column; align-items: center; }
.picker { display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(20, 18, 26, .9); box-shadow: 0 10px 30px rgba(40, 20, 80, .25); flex-wrap: wrap; justify-content: center; align-items: center; }
.picker button { all: unset; cursor: pointer; padding: 9px 16px; border-radius: 999px; color: rgba(255,255,255,.62); font: 600 13px Inter; display: flex; gap: 8px; align-items: center; transition: background .25s, color .25s; }
.picker button:hover { color: #fff; }
.picker button.on { background: #fff; color: #111; }
.picker kbd { font: 600 10px Inter; opacity: .5; border: 1px solid currentColor; border-radius: 5px; padding: 1px 5px; }
.picker .sep { width: 1px; height: 22px; background: rgba(255,255,255,.18); margin: 0 4px; }
.blurb { margin: 14px 0 22px; text-align: center; max-width: 740px; }
.blurb h2 { margin: 0 0 6px; font: 700 22px Inter; letter-spacing: -.02em; }
.blurb p { margin: 0; font: 400 14px/1.5 Inter; color: #4a4655; }
.stage { position: relative; width: 100%; display: flex; justify-content: center; min-height: 420px; }
.hint { margin-top: 18px; font: 500 12.5px Inter; color: #5b5668; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

/* ---------- the island (the app's black body) ---------- */
.island {
  position: relative; width: 724px; height: 404px; border-radius: 46px; background: #000; color: #fff;
  box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 24px 70px rgba(70, 40, 160, .35), 0 6px 18px rgba(0,0,0,.25);
  overflow: hidden; transform-origin: top center;
  animation: islandIn .7s var(--spring) both;
}
@keyframes islandIn { from { transform: scale(.82, .5); border-radius: 60px; opacity: .2 } to { transform: none; opacity: 1 } }
@media (max-width: 760px) { .island { transform: scale(calc(100vw / 760)); } }

.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; display: inline-block; text-transform: none; letter-spacing: normal; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; user-select: none; }
.ms.fill { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }

.bloub { display: inline-block; flex: none; }
.face { width: 40px; height: 40px; flex: none; cursor: pointer; transition: transform .5s var(--spring); }
.face:hover { transform: scale(1.1) rotate(-6deg); }

/* ---------- shared panel content ---------- */
.panel { position: absolute; inset: 0; padding: 0; }
.cards { display: grid; gap: 12px; height: 100%; }
.card { background: var(--card, rgba(255,255,255,.07)); border-radius: var(--card-r, 22px); padding: 14px 16px; position: relative; overflow: hidden; min-height: 0; }
.card h4 { margin: 0 0 10px; font: 600 13px var(--font, Inter); display: flex; justify-content: space-between; align-items: center; color: rgba(255,255,255,.92); }
.card h4 small { font: 500 11px var(--font, Inter); color: rgba(255,255,255,.42); }
.muted { color: rgba(255,255,255,.5); }
.row { display: flex; align-items: center; gap: 10px; }
.list .item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: var(--item-r, 16px); background: rgba(255,255,255,.055); margin-bottom: 7px; font: 500 13px var(--font, Inter); }
.list .item .grow { flex: 1; min-width: 0; }
.list .item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list .item .s { font-size: 11.5px; color: rgba(255,255,255,.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.pill-btn { all: unset; cursor: pointer; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.12); font: 600 12px var(--font, Inter); transition: background .2s, transform .3s var(--spring); }
.pill-btn:hover { background: rgba(255,255,255,.2); }
.pill-btn:active { transform: scale(.94); }
.pill-btn.accent { background: var(--accent, #0A84FF); color: var(--on-accent, #fff); }
.ico-tile { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.ico-tile .ms, .ico-tile i { font-size: 18px; }
.big { font: 600 34px/1 var(--font, Inter); letter-spacing: -.02em; }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
.bar > b { display: block; height: 100%; border-radius: 3px; }
.chipset { display: flex; flex-wrap: wrap; gap: 6px; }
.chipset span { padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,.1); font: 600 11.5px var(--font, Inter); cursor: pointer; }
.chipset span.on { background: var(--accent, #0A84FF); color: var(--on-accent, #fff); }
.mono { font-variant-numeric: tabular-nums; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 100%; }
.bars b { flex: 1; border-radius: 3px 3px 1px 1px; background: rgba(255,255,255,.25); transition: height .6s var(--spring); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font: 600 12.5px var(--font, Inter); }
.cal .h { font-size: 10.5px; color: rgba(255,255,255,.42); padding-bottom: 4px; }
.cal .d { padding: 6px 0; border-radius: 999px; }
.cal .d.today { background: var(--accent, #FF453A); color: var(--on-accent, #fff); }
.cal .d.we { color: rgba(255,255,255,.4); }
.note { border-radius: 18px; padding: 12px 14px; background: rgba(255, 214, 10, .12); font: 600 12.5px/1.45 var(--font, Inter); color: rgba(255,255,255,.92); display: flex; flex-direction: column; justify-content: space-between; }
.note small { font: 600 11px var(--font, Inter); color: rgba(255,255,255,.4); }
.check { width: 18px; height: 18px; border-radius: 50%; border: 1.6px solid rgba(255,255,255,.4); flex: none; display: grid; place-items: center; }
.check.done { background: #30D158; border-color: #30D158; }
.done-t { color: rgba(255,255,255,.38); text-decoration: line-through; }
.art { width: 104px; height: 104px; border-radius: 22px; background: linear-gradient(135deg, #6E4BFF, #FF5FA2); position: relative; flex: none; }
.art::after { content: ""; position: absolute; width: 34px; height: 34px; border-radius: 50%; right: 16px; top: 16px; background: rgba(255,255,255,.22); }
.wave { display: inline-flex; gap: 3px; align-items: center; height: 26px; }
.wave b { width: 3.4px; border-radius: 2px; background: #FF5FA2; animation: wave 1s ease-in-out infinite alternate; }
@keyframes wave { from { height: 25% } to { height: 100% } }

/* =========================================================== D1 · M3 primary tabs */
.m3 { --font: 'Roboto Flex', Roboto, sans-serif; --accent: #D0BCFF; --on-accent: #381E72; --card: #1D1B20; --card-r: 16px; --item-r: 12px; font-family: var(--font); }
.m3 .ms { color: inherit; }
.d1-top { position: absolute; left: 0; right: 0; top: 0; height: 74px; display: flex; align-items: flex-end; padding: 0 22px 0 20px; gap: 10px; border-bottom: 1px solid #49454F; }
.d1-top .face { margin-bottom: 16px; }
.d1-tabs { position: relative; flex: 1; display: flex; overflow-x: auto; scrollbar-width: none; height: 64px; }
.d1-tabs::-webkit-scrollbar { display: none; }
.d1-tab { all: unset; cursor: pointer; flex: none; min-width: 64px; padding: 0 12px; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #CAC4D0; font: 500 12.5px var(--font); letter-spacing: .01em; position: relative; border-radius: 12px 12px 0 0; }
.d1-tab:hover { background: rgba(230, 224, 233, .06); }
.d1-tab.on { color: #D0BCFF; }
.d1-tab.on .ms { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
.d1-ind { position: absolute; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: #D0BCFF; transition: left .5s var(--spring), width .5s var(--spring); }
.d1-trail { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
.m3-tonal { all: unset; cursor: pointer; height: 40px; padding: 0 14px 0 8px; border-radius: 20px; background: #4A4458; color: #E8DEF8; display: flex; align-items: center; gap: 8px; font: 500 13px var(--font); transition: filter .2s; }
.m3-tonal:hover { filter: brightness(1.12); }
.avs { display: flex; }
.avs .bloub + .bloub { margin-left: -7px; }
.m3-icon-btn { all: unset; cursor: pointer; width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: #CAC4D0; position: relative; transition: background .2s; }
.m3-icon-btn:hover { background: rgba(230,224,233,.08); }
.badge { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; border-radius: 8px; background: #F2B8B5; color: #601410; font: 700 10px var(--font, Inter); display: grid; place-items: center; padding: 0 4px; }
.d1-body { position: absolute; left: 16px; right: 16px; top: 88px; bottom: 16px; }
.d1-dialog { position: absolute; inset: 0; background: #141218; border-radius: 46px; transform: translateY(105%); transition: transform .6s var(--spring-soft); display: flex; flex-direction: column; z-index: 5; }
.d1-dialog.open { transform: none; }
.d1-bar { height: 64px; display: flex; align-items: center; gap: 6px; padding: 8px 22px 0 14px; }
.d1-bar h3 { flex: 1; margin: 0; font: 400 22px var(--font); }
.m3-text-btn { all: unset; cursor: pointer; height: 40px; padding: 0 16px; border-radius: 20px; color: #D0BCFF; font: 500 14px var(--font); display: grid; place-items: center; }
.m3-text-btn:hover { background: rgba(208,188,255,.08); }
.m3-filled-btn { all: unset; cursor: pointer; height: 40px; padding: 0 22px; border-radius: 20px; background: #D0BCFF; color: #381E72; font: 600 14px var(--font); display: grid; place-items: center; }
.d1-scroll { flex: 1; overflow-y: auto; padding: 4px 26px 22px; scrollbar-width: none; }
.d1-scroll::-webkit-scrollbar { display: none; }
.m3-chips { display: flex; gap: 8px; margin: 2px 0 14px; flex-wrap: wrap; }
.m3-chip { all: unset; cursor: pointer; height: 32px; padding: 0 14px 0 10px; border-radius: 8px; border: 1px solid #938F99; color: #CAC4D0; font: 500 13px var(--font); display: inline-flex; align-items: center; gap: 6px; transition: background .25s, border-color .25s; }
.m3-chip .ms { font-size: 18px; }
.m3-chip.on { background: #4A4458; border-color: transparent; color: #E8DEF8; }
.m3-chip:not(.on) .ms.chk { display: none; }
.m3-sec { font: 500 14px var(--font); color: #D0BCFF; margin: 14px 4px 6px; display: flex; justify-content: space-between; }
.m3-sec small { color: #938F99; font-weight: 400; }
.m3-li { display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 8px 0 14px; border-radius: 14px; background: #1D1B20; margin-bottom: 4px; user-select: none; touch-action: none; }
.m3-li .lead { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; background: #4A4458; color: #E8DEF8; flex: none; }
.m3-li .txt { flex: 1; min-width: 0; }
.m3-li .txt b { display: block; font: 500 15px var(--font); color: #E6E0E9; }
.m3-li .txt span { font: 400 12.5px var(--font); color: #CAC4D0; }
.m3-li .handle { color: #938F99; cursor: grab; width: 40px; height: 40px; display: grid; place-items: center; }
.m3-li.avail { background: transparent; }
.m3-li.avail .lead { background: #2B2930; color: #CAC4D0; }
.m3-li.dragging, .sortable .dragging { z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,.6); background: #36343B; }

/* =========================================================== D3 · M3 chips + bottom sheet */
.d3-top { position: absolute; left: 0; right: 0; top: 0; padding: 16px 20px 0 18px; display: flex; align-items: center; gap: 12px; height: 70px; }
.d3-chiprow { flex: 1; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px; mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 22px), transparent); }
.d3-chiprow::-webkit-scrollbar { display: none; }
.d3-chip { all: unset; cursor: pointer; flex: none; height: 34px; padding: 0 14px 0 10px; border-radius: 10px; border: 1px solid #49454F; color: #CAC4D0; font: 500 13.5px var(--font); display: inline-flex; align-items: center; gap: 7px; transition: background .3s, border-color .3s, color .3s, transform .4s var(--spring); }
.d3-chip .ms { font-size: 19px; }
.d3-chip:hover { background: rgba(230,224,233,.06); }
.d3-chip.on { background: #E8DEF8; color: #1D192B; border-color: transparent; }
.d3-chip.on .ms { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
.d3-chip:active { transform: scale(.95); }
.d3-assist { all: unset; cursor: pointer; flex: none; height: 34px; padding: 0 14px 0 10px; border-radius: 10px; background: #2B2930; color: #E6E0E9; font: 500 13px var(--font); display: inline-flex; align-items: center; gap: 7px; }
.d3-assist .ms { color: #D0BCFF; font-size: 19px; }
.d3-body { position: absolute; left: 16px; right: 16px; top: 82px; bottom: 16px; }
.d3-scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 4; }
.d3-scrim.open { opacity: 1; pointer-events: auto; }
.d3-sheet { position: absolute; left: 10px; right: 10px; bottom: 0; height: 84%; border-radius: 28px 28px 38px 38px; background: #1D1B20; transform: translateY(105%); transition: transform .6s var(--spring-soft); z-index: 5; padding: 0 22px 18px; display: flex; flex-direction: column; }
.d3-sheet.open { transform: none; }
.d3-grab { width: 32px; height: 4px; border-radius: 2px; background: #938F99; margin: 12px auto 10px; opacity: .6; }
.d3-sheet h3 { margin: 0 0 12px; font: 400 22px var(--font); display: flex; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid #938F99; border-radius: 20px; overflow: hidden; height: 36px; }
.seg button { all: unset; cursor: pointer; padding: 0 14px; font: 500 13px var(--font); color: #E6E0E9; display: flex; align-items: center; gap: 6px; border-left: 1px solid #938F99; transition: background .25s; }
.seg button:first-child { border-left: 0; }
.seg button.on { background: #4A4458; color: #E8DEF8; }
.seg button .ms { font-size: 18px; }
.seg button:not(.on) .ms { display: none; }
.d3-label { font: 500 12px var(--font); color: #938F99; letter-spacing: .06em; text-transform: uppercase; margin: 10px 2px 8px; }
.d3-wrap { display: flex; flex-wrap: wrap; gap: 8px; min-height: 36px; }
.input-chip { all: unset; cursor: grab; height: 34px; padding: 0 6px 0 10px; border-radius: 10px; background: #4A4458; color: #E8DEF8; font: 500 13.5px var(--font); display: inline-flex; align-items: center; gap: 7px; touch-action: none; user-select: none; }
.input-chip .ms { font-size: 19px; }
.input-chip .x { width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; }
.input-chip .x:hover { background: rgba(255,255,255,.12); }
.input-chip .x .ms { font-size: 17px; }
.sugg-chip { all: unset; cursor: pointer; height: 34px; padding: 0 14px 0 10px; border-radius: 10px; border: 1px solid #49454F; color: #CAC4D0; font: 500 13.5px var(--font); display: inline-flex; align-items: center; gap: 7px; transition: background .2s; }
.sugg-chip:hover { background: rgba(230,224,233,.06); }
.sugg-chip .ms { font-size: 19px; }
.sugg-chip .plus { color: #D0BCFF; }



/* =========================================================== the shared island header (same as the app) */
.hdr { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; align-items: center; padding: 0 22px 0 18px; gap: 12px; z-index: 8; }
.hdr .face { width: 44px; height: 40px; display: grid; place-items: center; }
.tabs { position: relative; flex: 1; min-width: 0; height: 30px; }
.tabrow { position: absolute; inset: 0; display: flex; gap: 4px; align-items: center; }
.sel { position: absolute; top: 0; height: 30px; border-radius: 15px; background: rgba(255,255,255,.14); transition: left .5s var(--spring), width .5s var(--spring); }
.tab { all: unset; cursor: pointer; position: relative; height: 30px; padding: 0 12px; border-radius: 15px; display: flex; align-items: center; gap: 6px; font: 600 13px Inter; color: rgba(255,255,255,.42); white-space: nowrap; transition: color .25s; touch-action: none; user-select: none; flex: none; }
.tab:hover { color: rgba(255,255,255,.75); }
.tab.on { color: #fff; }
.tab .ms { font-size: 17px; display: none; }
.tab.icon-only { padding: 0 8px; }
.tab.icon-only .ms { display: inline-block; }
.tab.icon-only span:last-child { display: none; }
.tab:not(.icon-only)::after { display: none !important; }
.island.customizing .tab { box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); background: rgba(255,255,255,.04); cursor: grab; animation: wob .34s ease-in-out infinite alternate; }
.island.customizing .tab:nth-child(2n) { animation-delay: -.17s; }
@keyframes wob { from { rotate: -1.4deg; } to { rotate: 1.4deg; } }
.team { all: unset; cursor: pointer; position: relative; height: 32px; padding: 0 10px 0 9px; border-radius: 16px; background: rgba(255,255,255,.08); display: flex; align-items: center; transition: background .2s; }
.team:hover { background: rgba(255,255,255,.16); }
.team .bloub + .bloub { margin-left: -4px; }
.team .bloub { transition: transform .45s var(--spring); }
.team:hover .bloub { transform: translateY(-3px); }
.team:hover .bloub:nth-child(2) { transition-delay: .04s; } .team:hover .bloub:nth-child(3) { transition-delay: .08s; } .team:hover .bloub:nth-child(4) { transition-delay: .12s; }
.team::before { content: ""; position: absolute; inset: 0; border-radius: 16px; box-shadow: inset 0 0 0 1.4px #FF9F0A; animation: needs 1.25s ease-in-out infinite alternate; }
@keyframes needs { from { opacity: .35 } to { opacity: .95 } }
.pen { all: unset; cursor: pointer; position: relative; width: 32px; height: 32px; border-radius: 16px; background: rgba(255,255,255,.1); display: grid; place-items: center; color: #fff; transition: background .25s, transform .4s var(--spring); }
.pen:hover { background: rgba(255,255,255,.18); }
.pen.on { background: #0A84FF; }
.pen .ms { font-size: 18px; }
[data-tip]:hover::after { content: attr(data-tip); position: absolute; top: calc(100% + 8px); left: 50%; translate: -50% 0; padding: 4px 9px; border-radius: 11px; background: #3A3A3C; font: 600 11.5px Inter; color: #fff; white-space: nowrap; pointer-events: none; z-index: 50; animation: tipIn .3s var(--spring); }
@keyframes tipIn { from { opacity: 0; transform: translateY(-4px) scale(.9); } }
.body { position: absolute; left: 16px; right: 16px; top: 66px; bottom: 16px; }

/* =========================================================== 1 · M3 full-screen dialog */
.island .d1-dialog { top: 60px; border-radius: 28px 28px 46px 46px; }
.island .d1-dialog .d1-bar h3 { font-family: 'Roboto Flex', sans-serif; }

/* =========================================================== 2 · M3 bottom sheet */
.island .d3-scrim { top: 60px; border-radius: 0 0 46px 46px; }
.island .d3-sheet { height: calc(100% - 72px); }

/* =========================================================== 3 · M3 selectable cards */
.m3c { position: absolute; left: 0; right: 0; top: 60px; bottom: 0; z-index: 5; background: #141218; border-radius: 28px 28px 46px 46px; padding: 12px 18px 18px; display: flex; flex-direction: column; gap: 12px; opacity: 0; transform: translateY(16px); pointer-events: none; transition: opacity .25s, transform .5s var(--spring-soft); }
.m3c.open { opacity: 1; transform: none; pointer-events: auto; }
.m3c-head { display: flex; align-items: center; gap: 12px; }
.m3c-head h3 { margin: 0; font: 400 22px 'Roboto Flex', sans-serif; color: #E6E0E9; }
.m3c-head small { font: 500 13px 'Roboto Flex'; color: #938F99; margin-left: 8px; }
.m3c-head .grow { flex: 1; display: flex; align-items: baseline; }

// set by each design: 'm' for Material Symbols, 'p' for Phosphor
let ICONSET = 'm';
function icon(name, opts = {}) {

    <rect x="13.2" y="12.5" width="4.6" height="10.5" rx="2.3" fill="${eye}" transform="rotate(8 15.5 17.75)"/><rect x="22.2" y="12" width="4.6" height="10.5" rx="2.3" fill="${eye}" transform="rotate(8 24.5 17.25)"/></svg>`;

/* FLIP: animate elements (matched by data-id) from where they were to where they are after `mutate`. */
function flip(root, mutate, { stagger = 0 } = {}) {
  const before = new Map();
  root.querySelectorAll('[data-id]').forEach(e => before.set(e.dataset.flip || e.dataset.id, e.getBoundingClientRect()));
  mutate();
  let k = 0;
  root.querySelectorAll('[data-id]').forEach(e => {
    const key = e.dataset.flip || e.dataset.id, b = before.get(key), a = e.getBoundingClientRect();

/* Drag to reorder inside a container: items with data-id; calls onDone(ids) on drop. */
function sortable(container, { axis = 'x', enabled = () => true, handle = null, onDone }) {
  let drag = null;

    if (!enabled()) return;
    const item = e.target.closest('[data-id]');

    if (handle && !e.target.closest(handle)) return;
    if (e.target.closest('[data-nodrag]')) return;

    if (!drag) return;
    const { item } = drag;

    item.style.transform = `translate(${axis === 'y' ? 0 : dx - drag.ox}px, ${axis === 'x' ? 0 : dy - drag.oy}px) scale(1.06)`;
    const rect = item.getBoundingClientRect();

  document.querySelectorAll('[data-net]').forEach(b => { const d = net[b.dataset.net]; b.innerHTML = d.map((v, i) => `<b style="height:${Math.max(3, v * 100)}%;background:${b.dataset.net};opacity:${.35 + .65 * i / 60}"></b>`).join(''); });
}, 500);

/* swap a panel with a soft cross-fade + rise */
function showPanel(host, id) {
  const old = host.firstElementChild;
  const neu = document.createElement('div');
  neu.className = 'panel';
  neu.innerHTML = panel(id);
  if (old) { old.animate([{ opacity: 1 }, { opacity: 0, filter: 'blur(6px)', transform: 'scale(.97)' }], { duration: 180, easing: 'ease-in' }).onfinish = () => old.remove(); }
  host.appendChild(neu);
  neu.animate([{ opacity: 0, transform: 'translateY(10px) scale(.98)', filter: 'blur(8px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 520, delay: 70, easing: SPRING(), fill: 'backwards' });
}



/* ============================================================ helpers for these concepts */
function shake(el) { el?.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-7px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(0)' }], { duration: 380, easing: 'ease-out' }); }
const LUC = { overview: 'layout-dashboard', agents: 'bot', usage: 'chart-line', projects: 'folder-open', media: 'music', focus: 'target', tasks: 'list-checks', calendar: 'calendar', timer: 'timer', notes: 'sticky-note', clipboard: 'clipboard', downloads: 'download', clocks: 'globe', network: 'wifi', system: 'cpu' };
const lu = (n, cls = '') => `<i data-lucide="${n}" class="${cls}"></i>`;
const drawLucide = () => { try { window.lucide && lucide.createIcons(); } catch {} };
const ph = (n, w = 'bold') => `<i class="ph-${w} ph-${n}"></i>`;
const names = ids => { const n = ids.map(i => T[i].name); return n.length < 2 ? n.join('') : n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1]; };

/* ============================================================ the shared island (identical in every concept) */
const App = {
  island: null, design: null, customizing: false,
  build(design) {
    this.design?.unmount?.();
    this.design = design; this.customizing = false;
    const stage = $('#stage');
    stage.innerHTML = '<div class="island"></div>';
    const el = this.island = stage.firstElementChild;
    el.innerHTML = `
      <div class="hdr"><div class="face">${bloub(40)}</div>
        <div class="tabs"><div class="sel" id="sel"></div><div class="tabrow" id="tabrow"></div></div>
        <button class="team" id="team" data-tip="2 working · 1 needs you">${AGENTS.map(a => bloub(17, a.c)).join('')}</button>
        <button class="pen" id="pen" data-tip="Customize tabs"><span class="ms">edit</span></button></div>
      <div class="body" id="body"></div>`;
    this.renderTabs(true);
    showPanel($('#body', el), state.selected);
    $('#pen', el).onclick = () => this.customizing ? design.close() : design.open();
    $('#team', el).onclick = () => { if (state.enabled.includes('agents')) this.select('agents'); else showPanel($('#body', el), 'agents'); };
    sortable($('#tabrow', el), { axis: 'x', enabled: () => this.customizing, onDone: ids => { state.enabled = ids; this.moveSel(); design.sync?.(); } });
    design.mount(el, this);
  },
  renderTabs(first) {
    const host = $('#tabrow', this.island);
    const doIt = () => {
      host.innerHTML = state.enabled.map(id => `<button class="tab ${id === state.selected ? 'on' : ''}" data-id="${id}" data-tip="${T[id].name}">${icon(id)}<span>${T[id].name}</span></button>`).join('');
      const tabs = [...host.children];
      if (host.scrollWidth > host.clientWidth + 1) tabs.forEach(b => { if (!b.classList.contains('on')) b.classList.add('icon-only'); });
      tabs.forEach(b => b.onclick = () => this.select(b.dataset.id));
    };
    if (first) doIt(); else flip(host, doIt);
    this.moveSel(first);
  },
  moveSel(instant) {
    const on = this.island.querySelector('.tab.on'), sel = $('#sel', this.island);
    if (!on) return;
    if (instant) sel.style.transition = 'none';
    sel.style.left = on.offsetLeft + 'px'; sel.style.width = on.offsetWidth + 'px';
    if (instant) requestAnimationFrame(() => requestAnimationFrame(() => sel.style.transition = ''));
  },
  select(id) { if (id === state.selected) return; state.selected = id; this.renderTabs(); showPanel($('#body', this.island), id); },
  set(ids) {
    state.enabled = [...ids];
    if (!state.enabled.includes(state.selected)) { state.selected = state.enabled[0]; showPanel($('#body', this.island), state.selected); }
    this.renderTabs();
  },
  add(id) { if (state.enabled.includes(id)) return true; if (state.enabled.length >= MAX) return false; this.set([...state.enabled, id]); return true; },
  remove(id) { if (!state.enabled.includes(id)) return true; if (state.enabled.length <= 1) return false; this.set(state.enabled.filter(x => x !== id)); return true; },
  setCustomizing(on) {
    this.customizing = on;
    this.island.classList.toggle('customizing', on);
    const pen = $('#pen', this.island);
    pen.classList.toggle('on', on);
    pen.dataset.tip = on ? 'Done' : 'Customize tabs';
    pen.innerHTML = `<span class="ms">${on ? 'check' : 'edit'}</span>`;
    pen.animate([{ transform: 'scale(.6) rotate(-40deg)' }, { transform: 'none' }], { duration: 500, easing: SPRING() });
  },
};

  [/code|coding|dev|program|engineer|build|ship|claude/, ['agents', 'usage', 'projects', 'timer', 'notes'], 'everything you need while your agents code'],

  [/download|file/, ['downloads'], 'to grab files the moment they land'],
  [/game|gaming|pc|gpu|cpu|perf|render/, ['system', 'network'], 'to keep an eye on your machine'],
  [/copy|clipboard|paste/, ['clipboard'], 'so recent copies stay handy'],
  [/wifi|network|internet|stream/, ['network'], 'to watch your connection live'],
];
const GPT = {
  name: 'ChatGPT style',
  title: 'ChatGPT-style — Settings & ask',
  text: 'Modelled on ChatGPT\'s settings: a left nav, quiet rows with switches, drag to reorder. At the bottom is a ChatGPT-style composer: describe how you work ("I code all day and listen to music") and it picks your tabs, streaming its answer while the switches flip.',
  hint: ['Pencil → settings', 'Try a suggestion or type your own', 'Tab bar: drag ⋮ to reorder', 'All tabs: switches · Presets'],
  view: 'bar',
  mount(el, app) {
    this.app = app;
    const g = this.g = document.createElement('div');
    g.className = 'gpt';
    g.innerHTML = `<div class="gpt-scrim" data-close></div>
      <div class="gpt-modal">

        <nav class="gpt-nav">${[['bar', 'panel-top', 'Tab bar'], ['all', 'layout-grid', 'All tabs'], ['presets', 'sparkles', 'Presets']].map(([k, i, n]) => `<button data-v="${k}">${lu(i)}${n}</button>`).join('')}</nav>
        <div class="gpt-main">
          <div class="gpt-list" data-list></div>
          <div class="gpt-reply" data-reply></div>
          <div class="gpt-chips" data-chips>${SUGG.map(([i, c, t]) => `<button class="gpt-chip" data-ask="${t}"><span style="color:${c};display:flex">${lu(i)}</span>${t}</button>`).join('')}</div>
          <form class="gpt-comp" data-form><input data-in placeholder="Describe how you work, I'll pick your tabs" autocomplete="off"><button class="gpt-send" data-send disabled title="Send">${lu('arrow-up')}</button></form>
        </div>
      </div>`;
    el.appendChild(g);
    g.querySelectorAll('[data-close]').forEach(b => b.onclick = () => this.close());

    const inp = g.querySelector('[data-in]'), send = g.querySelector('[data-send]');
    inp.oninput = () => send.disabled = !inp.value.trim();
    g.querySelector('[data-form]').onsubmit = e => { e.preventDefault(); this.ask(inp.value); };
    g.querySelectorAll('[data-ask]').forEach(b => b.onclick = () => this.ask(b.dataset.ask));

  },
  open() { this.render(true); this.g.classList.add('open'); this.app.setCustomizing(true); },

      if (this.view === 'bar') {
        list.innerHTML = `<div data-rows>${state.enabled.map(id => `<div class="gpt-row" data-id="${id}"><span class="grip">${lu('grip-vertical')}</span><span class="ic">${lu(LUC[id])}</span><div class="nm">${T[id].name}<small>${T[id].blurb}</small></div><button class="gpt-ghost" data-nodrag data-rm="${id}" title="Remove">${lu('x')}</button></div>`).join('')}</div>
          <div class="gpt-foot"><span>${state.enabled.length} of ${MAX} tabs</span><button class="gpt-btn" data-go="all">${lu('plus')}Add tabs</button></div>`;
        sortable(list.querySelector('[data-rows]'), { axis: 'y', handle: '.grip', onDone: ids => { state.enabled = ids; app.renderTabs(); } });
        list.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (!app.remove(b.dataset.rm)) return shake(b.closest('.gpt-row')); this.render(); });
        list.querySelector('[data-go]').onclick = () => { this.view = 'all'; this.render(true); };
      } else if (this.view === 'all') {
        const q = this.q || '';
        list.innerHTML = `<div class="gpt-search">${lu('search')}<input data-q placeholder="Search tabs" value="${q}"></div>
          ${TABS.filter(t => !q || (t.name + t.blurb).toLowerCase().includes(q.toLowerCase())).map(t => `<div class="gpt-row" data-id="${t.id}"><span class="ic">${lu(LUC[t.id])}</span><div class="nm">${t.name}<small>${t.blurb}</small></div><button class="sw ${state.enabled.includes(t.id) ? 'on' : ''}" data-sw="${t.id}" title="Show in tab bar"></button></div>`).join('')}`;
        const qi = list.querySelector('[data-q]');
        qi.oninput = () => { this.q = qi.value; this.render(true); const n = this.g.querySelector('[data-q]'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
        list.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => {
          const id = b.dataset.sw, ok = state.enabled.includes(id) ? app.remove(id) : app.add(id);
          if (!ok) return shake(b.closest('.gpt-row'));
          b.classList.toggle('on', state.enabled.includes(id));
        });
      } else {
        list.innerHTML = PRESETS.map((p, i) => { const on = p.tabs.join() === state.enabled.join(); return `<div class="gpt-row"><span class="ic">${lu(['minimize-2', 'star', 'code', 'layers'][i])}</span><div class="nm">${p.name}<small>${p.tabs.map(x => T[x].name).join(' · ')}</small></div>${on ? `<span style="color:#10A37F;display:flex;gap:6px;align-items:center;font-size:13px">${lu('check')}Active</span>` : `<button class="gpt-btn" data-p="${i}">Use</button>`}</div>`; }).join('');
        list.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { app.set(PRESETS[+b.dataset.p].tabs); this.render(); });
      }
      drawLucide();
    };
    if (first) doIt(); else flip(list, doIt);
  },
  plan(text) {
    const s = text.toLowerCase();
    if (/minimal|simple|clean|less|fewer|declutter/.test(s)) return { preset: 0, msg: `Done, I switched you to <b>Minimal</b>: just ${names(PRESETS[0].tabs)}. Less noise, same island.` };
    if (/everything|all of|every tab|max/.test(s)) return { preset: 3, msg: `You've got <b>Everything</b> now: ten tabs, the most the bar holds. Turn off any you don't use.` };
    let adds = [], why = [], matched = false;
    for (const [re, ids, reason] of KW) if (re.test(s)) { matched = true; why.push(reason); ids.forEach(i => { if (!adds.includes(i) && !state.enabled.includes(i)) adds.push(i); }); }
    if (!matched) return { adds: [], msg: `I couldn't tell which tabs fit. Tell me what you do, like coding, music, meetings or studying.` };
    if (!adds.length) return { adds: [], msg: `You already have everything for that. Your bar looks good as it is.` };
    const room = MAX - state.enabled.length;
    if (room <= 0) return { adds: [], msg: `Your bar is full (${MAX} of ${MAX}). Remove a tab and ask again, and I'll add ${names(adds)}.` };
    const left = adds.slice(room); adds = adds.slice(0, room);
    return { adds, msg: `Added <b>${names(adds)}</b> ${why[0]}.${left.length ? ` I'd also add ${names(left)}, but your bar is full.` : ''}` };
  },
  ask(text) {
    text = (text || '').trim();
    if (!text || this.busy) return;
    this.busy = true;
    const g = this.g, inp = g.querySelector('[data-in]'), reply = g.querySelector('[data-reply]');
    inp.value = ''; g.querySelector('[data-send]').disabled = true;
    g.querySelector('[data-chips]').style.display = 'none';
    reply.classList.add('on');
    reply.innerHTML = '<span class="shimmer">Thinking</span>';
    const plan = this.plan(text);
    setTimeout(() => {
      if (plan.preset != null) this.app.set(PRESETS[plan.preset].tabs);
      if (plan.preset != null || plan.adds.length) { this.view = 'bar'; this.render(true); }
      plan.adds?.forEach((id, k) => setTimeout(() => { this.app.add(id); this.render(); }, 160 + k * 230));
      const plain = plan.msg.replace(/<[^>]+>/g, '').split(/(\s+)/);
      let i = 0;
      reply.textContent = '';
      const step = () => {
        if (i >= plain.length) { reply.innerHTML = plan.msg; this.busy = false; return; }
        reply.textContent += plain[i++];
        setTimeout(step, 24);
      };
      step();
    }, 850);
  },
};

/* ============================================================ 5 · Grok Bot style */
const Grok = {
  name: 'Grok Bot style',
  title: 'Grok Bot–style — Pins in orbit',
  text: 'Taken from the Grok Bot widget: pure black, a soft coloured glow and stars, the big shaded Bloub with orbiting moons and a status badge, and every tab as a colour-tinted pill. Tap one and it shoots into your bar as a spark (the glow takes its colour); tap again and it falls back. Done turns everything green.',
  hint: ['Pencil → the library', 'Tap a dim pill to pin it', 'Tap a bright pill to unpin', 'Drag the wiggling tabs to reorder'],
  mount(el, app) {
    this.app = app; this.dead = false;
    const g = this.g = document.createElement('div');
    g.className = 'grok';
    let stars = '';
    for (let i = 0; i < 34; i++) stars += `<i style="left:${(Math.random() * 100).toFixed(1)}%;top:${(Math.random() * 100).toFixed(1)}%;animation-delay:-${(Math.random() * 4).toFixed(2)}s;animation-duration:${(3 + Math.random() * 4).toFixed(1)}s"></i>`;
    g.innerHTML = `<div class="gk-stars">${stars}</div>
      <div class="gk-left"><div class="gk-cap">Tab library</div>
        <div class="gk-orb"><span class="gk-moon"></span><span class="gk-moon"></span><span class="gk-badge"><b></b><b></b><b></b></span>
          <svg class="gk-bloub" viewBox="0 0 120 120" width="120" height="120"><circle cx="60" cy="60" r="56" fill="url(#gkShade)"/>
            <g data-eyes><g class="blink" style="transform-origin:60px 50px;animation:blink 4.2s infinite"><rect x="40" y="35" width="12" height="29" rx="6" fill="#0b0b10" transform="rotate(8 46 50)"/><rect x="65" y="34" width="12" height="29" rx="6" fill="#0b0b10" transform="rotate(8 71 49)"/></g></g></svg></div>
        <div class="gk-status" data-status></div>
        <button class="gk-done" data-done>${ph('check-square', 'fill')}Done</button></div>
      <div class="gk-pills" data-pills>${TABS.map(t => `<button class="gk-pill" data-t="${t.id}" style="--c:${t.c}"><span class="dot">${ph(t.p)}</span>${t.name}<span class="n"></span></button>`).join('')}</div>`;
    el.appendChild(g);
    if (!document.getElementById('blinkKf')) { const st = document.createElement('style'); st.id = 'blinkKf'; st.textContent = '@keyframes blink { 0%, 93%, 100% { transform: scaleY(1) } 96% { transform: scaleY(.08) } }'; document.head.appendChild(st); }
    g.querySelector('[data-done]').onclick = () => this.close();
    g.querySelectorAll('.gk-pill').forEach(p => p.onclick = () => this.toggle(p.dataset.t, p));
    // Bloub watches the pointer
    const eyes = g.querySelector('[data-eyes]'), svg = g.querySelector('.gk-bloub');
    g.addEventListener('pointermove', e => {
      const r = svg.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 160);
      eyes.setAttribute('transform', `translate(${(dx / d * 6 * k).toFixed(2)} ${(dy / d * 5 * k).toFixed(2)})`);
    });
    // two moons on a tilted orbit, passing behind and in front
    const moons = [...g.querySelectorAll('.gk-moon')];
    const loop = t => {
      if (this.dead) return;
      moons.forEach((m, i) => {
        const a = t / 1000 * .7 + i * Math.PI, x = 66 + Math.cos(a) * 92, y = 72 + Math.sin(a) * 34 - Math.cos(a) * 10, front = Math.sin(a) > 0;
        m.style.transform = `translate(${x - 7.5}px, ${y - 7.5}px) scale(${front ? 1 : .78})`;
        m.style.zIndex = front ? 2 : 0;
        m.style.opacity = front ? 1 : .7;
      });
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  },
  unmount() { this.dead = true; },
  open() {
    const g = this.g;
    g.style.setProperty('--glow', '#2f6bff');
    g.querySelector('.gk-badge').className = 'gk-badge';
    this.say('Tap a tab to pin it', 'hand-tap');
    this.sync(); g.classList.add('open'); this.app.setCustomizing(true);
    g.querySelector('.gk-orb').animate([{ transform: 'scale(.55) translateY(20px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 750, easing: SPRING() });
    g.querySelectorAll('.gk-pill').forEach((p, i) => p.animate([{ translate: '0 18px', scale: '.88' }, { translate: '0 0', scale: '1' }], { duration: 650, delay: 80 + i * 28, easing: SPRING(), fill: 'backwards' }));
  },
  close() {
    const g = this.g, badge = g.querySelector('.gk-badge');
    g.style.setProperty('--glow', '#30D158');
    badge.className = 'gk-badge on ok';
    this.say('Done', 'check-square', 'fill');
    this.hop();
    setTimeout(() => { g.classList.remove('open'); this.app.setCustomizing(false); }, 700);
  },
  sync() {
    this.g.querySelectorAll('.gk-pill').forEach(p => {
      const i = state.enabled.indexOf(p.dataset.t);
      p.classList.toggle('off', i < 0);
      p.querySelector('.n').textContent = i >= 0 ? String(i + 1).padStart(2, '0') : '';
    });
  },
  say(text, ic, w = 'bold', warn) {
    const s = this.g.querySelector('[data-status]');
    s.className = 'gk-status' + (warn ? ' warn' : '');
    s.innerHTML = `${ph(ic, w)}<span>${text}</span>`;
    s.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: SPRING() });
  },
  hop() { this.g.querySelector('.gk-bloub').animate([{ transform: 'none' }, { transform: 'translateY(4px) scale(1.08, .9)', offset: .2 }, { transform: 'translateY(-12px) scale(.95, 1.06)', offset: .5 }, { transform: 'none' }], { duration: 620, easing: 'ease-out' }); },
  toggle(id, pill) {
    const app = this.app, t = T[id], badge = this.g.querySelector('.gk-badge');
    if (state.enabled.includes(id)) {
      const from = app.island.querySelector(`.tab[data-id="${id}"]`)?.getBoundingClientRect();
      if (!app.remove(id)) { shake(pill); return this.say('Keep at least one tab', 'warning', 'bold', true); }
      if (from) this.fly(from, pill.querySelector('.dot').getBoundingClientRect(), t.c, () => pill.animate([{ transform: 'scale(1.12)' }, { transform: 'none' }], { duration: 420, easing: SPRING() }));
      this.say(`Unpinned ${t.name}`, 'minus-circle');
    } else {
      if (!app.add(id)) { shake(pill); return this.say('Your bar is full, unpin one first', 'warning', 'bold', true); }
      const tab = app.island.querySelector(`.tab[data-id="${id}"]`);
      tab.getAnimations().forEach(a => a.cancel());
      tab.style.opacity = 0;
      badge.className = 'gk-badge on';
      this.g.style.setProperty('--glow', t.c);
      this.hop();
      this.fly(pill.querySelector('.dot').getBoundingClientRect(), tab.getBoundingClientRect(), t.c, () => {
        tab.style.opacity = '';
        tab.animate([{ transform: 'scale(1.35)', background: hex(t.c, .45), color: '#fff' }, { transform: 'none', background: 'transparent' }], { duration: 700, easing: SPRING() });
        badge.className = 'gk-badge';
      });
      this.say(`Pinned ${t.name} · ${state.enabled.length} of ${MAX}`, 'push-pin', 'fill');
    }
    this.sync();
  },
  fly(a, b, c, done) {
    const I = this.app.island.getBoundingClientRect();
    const x0 = a.left + a.width / 2 - I.left, y0 = a.top + a.height / 2 - I.top, x1 = b.left + b.width / 2 - I.left, y1 = b.top + b.height / 2 - I.top;
    const mx = x0 + (x1 - x0) * .4 + (x1 < x0 ? 50 : -50), my = Math.min(y0, y1) - 26;
    for (let k = 0; k < 5; k++) {
      const s = document.createElement('div');
      s.className = 'gk-spark'; s.style.setProperty('--c', c);
      const sc = 1 - k * .17;
      this.app.island.appendChild(s);
      s.animate([
        { transform: `translate(${x0}px,${y0}px) scale(${sc})`, opacity: 1 - k * .18 },
        { transform: `translate(${mx}px,${my}px) scale(${sc * 1.3})`, offset: .45 },
        { transform: `translate(${x1}px,${y1}px) scale(${sc * .4})`, opacity: .2 }],
        { duration: 720, delay: k * 32, easing: 'cubic-bezier(.55,0,.25,1)', fill: 'both' }).onfinish = () => { s.remove(); if (k === 0) done?.(); };
    }
  },
};

/* ============================================================ shell */
const DESIGNS = [M3Dialog, M3Sheet, M3Cards, GPT, Grok];
function choose(i) {
  const d = DESIGNS[i];
  document.querySelectorAll('#picker button').forEach((b, k) => b.classList.toggle('on', k === i));
  $('#dTitle').textContent = d.title;
  $('#dText').textContent = d.text;
  $('#hint').innerHTML = d.hint.map(h => `<span>• ${h}</span>`).join('');
  App.build(d);
  try { localStorage.setItem('island-customize', i); } catch {}
  if (location.hash.endsWith('e')) setTimeout(() => d.open(), 350);
}
$('#picker').innerHTML = DESIGNS.map((d, i) => `${i === 3 ? '<span class="sep"></span>' : ''}<button>${d.name}<kbd>${i + 1}</kbd></button>`).join('');
document.querySelectorAll('#picker button').forEach((b, i) => b.onclick = () => choose(i));
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; const n = +e.key; if (n >= 1 && n <= 5) choose(n - 1); });
let start = 0;
try { start = +(localStorage.getItem('island-customize') || 0); } catch {}
if (/^#[1-5]e?$/.test(location.hash)) start = +location.hash[1] - 1;
document.fonts.ready.then(() => choose(Math.min(4, Math.max(0, start))));
</script>
