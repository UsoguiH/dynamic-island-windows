<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside an agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-25..200&display=block" rel="stylesheet">
<style>
:root {
  --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
  --soft: linear(0, 0.06 3%, 0.23 7.4%, 0.55 14.6%, 0.81 22.4%, 0.94 29.6%, 1.01 37.4%, 1.03 44.6%, 1.02 55%, 1);
  --page: #d9dbe8; --ink: #1d1b22; --sub: #4a4655;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #17161d; --ink: #f1eff6; --sub: #a9a4b6; } }
:root[data-theme="dark"] { --page: #17161d; --ink: #f1eff6; --sub: #a9a4b6; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: var(--ink); background: var(--page); overflow-x: hidden; }
.page { max-width: 1100px; margin: 0 auto; padding: 22px 16px 60px; display: flex; flex-direction: column; align-items: center; }
.picker { display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: #121116; flex-wrap: wrap; justify-content: center; }
.picker button { all: unset; cursor: pointer; padding: 9px 16px; border-radius: 999px; color: rgba(255,255,255,.62); font: 600 13px Inter; display: flex; gap: 8px; align-items: center; transition: background .25s, color .25s; }
.picker button:hover { color: #fff; }
.picker button.on { background: #fff; color: #111; }
.picker kbd { font: 600 10px Inter; opacity: .5; border: 1px solid currentColor; border-radius: 5px; padding: 1px 5px; }
.blurb { margin: 14px 0 20px; text-align: center; max-width: 720px; min-height: 76px; }
.blurb h2 { margin: 0 0 6px; font: 700 22px Inter; letter-spacing: -.02em; }
.blurb p { margin: 0; font: 400 14px/1.5 Inter; color: var(--sub); }
.stage { width: 100%; display: flex; justify-content: center; min-height: 520px; align-items: flex-start; }
.tools { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tools button { all: unset; cursor: pointer; padding: 9px 15px; border-radius: 999px; background: #121116; color: #fff; font: 600 12.5px Inter; display: flex; gap: 6px; align-items: center; }
.tools button:hover { background: #000; }
.tools .ms { font-size: 17px; }
.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; display: inline-block; white-space: nowrap; -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; user-select: none; }

.picker button em { font: 700 9.5px Inter; font-style: normal; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 999px; background: #30D158; color: #04210c; }
.stage { min-height: 500px; }
.fit { width: auto; display: flex; justify-content: center; }
.tools { max-width: 760px; }
.tools .sep { width: 1px; align-self: stretch; margin: 4px 4px; background: color-mix(in srgb, var(--ink) 18%, transparent); }
.tools button.on { background: #fff; color: #111; }
.tools .sw { all: unset; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; background: var(--c); align-self: center; transition: transform .4s var(--spring); }
.tools .sw:hover { transform: scale(1.15); background: var(--c); } .tools .sw.on { transform: scale(1.34); background: var(--c); }
.note { margin: 14px 0 0; max-width: 640px; text-align: center; font: 400 12.5px/1.5 Inter; color: var(--sub); }

/* ---------- the island, at its real size ---------- */
.island { position: relative; width: var(--w); height: var(--h); flex: none; border-radius: 50px; background: #000; color: #fff; overflow: hidden; transform-origin: top center; font-family: Inter, system-ui, sans-serif;
  --ag: #F0479B; --agd: color-mix(in srgb, var(--ag) 26%, #0b0b0d); --agl: color-mix(in srgb, var(--ag) 62%, #fff); --stc: rgba(255,255,255,.45);
  box-shadow: 0 24px 70px rgba(30, 20, 80, .28), 0 6px 18px rgba(0,0,0,.22); animation: islandIn .7s var(--spring) both; }
@keyframes islandIn { from { transform: scale(.9); opacity: 0; } }
@media (max-width: 552px) { .island { zoom: calc((100vw - 32px) / 520px); } }
.island[data-st="working"] { --stc: #4DA3FF; } .island[data-st="needs"] { --stc: #FF9F0A; } .island[data-st="done"] { --stc: #30D158; } .island[data-st="ended"] { --stc: #FF6259; }
button { font: inherit; color: inherit; }
.island ::-webkit-scrollbar { width: 0; height: 0; }

.hd { position: absolute; left: 20px; right: 20px; top: 16px; height: 36px; display: flex; align-items: center; gap: 8px; z-index: 40; }
.hd .mgr { width: 26px; height: 26px; flex: none; margin-right: 3px; }
.hd .nm { font: 700 14.5px Inter; }
.hd .stt { font: 500 12.5px Inter; color: var(--stc); transition: color .3s; white-space: nowrap; }
.hd .path { font: 500 12px Inter; color: rgba(255,255,255,.34); }
.hd .sp { flex: 1; }
.back { all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.09); display: grid; place-items: center; flex: none; transition: background .2s, transform .4s var(--spring); }
.back:hover { background: rgba(255,255,255,.18); } .back:active { transform: scale(.88); }
.back .ms { font-size: 18px; }
.stats { display: flex; align-items: center; gap: 9px; font: 500 11px Inter; color: rgba(255,255,255,.36); white-space: nowrap; }
.stats .ctx { display: inline-flex; align-items: center; gap: 5px; }
.stats .ctx i { display: block; width: 24px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); position: relative; overflow: hidden; }
.stats .ctx i::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: var(--f, 30%); background: rgba(255,255,255,.62); border-radius: 2px; transition: width .6s var(--soft); }

/* him: the agent's own Bloub, large (a click pokes him) */
.who { position: absolute; z-index: 20; cursor: pointer; }
.who .bl { display: block; }

/* what he is doing, in one line */
.now { margin: 0; font: 750 19px/1.25 Inter; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.now.in { animation: nowIn .5s var(--soft) both; }
@keyframes nowIn { from { transform: translateY(9px); opacity: 0; filter: blur(4px); } }
.island[data-st="working"] .now { background: linear-gradient(100deg, rgba(255,255,255,.6) 36%, #fff 50%, rgba(255,255,255,.6) 64%) 0 0 / 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
.island[data-st="working"] .now.in { animation: nowIn .5s var(--soft) both, shim 1.7s linear infinite; }
@keyframes shim { from { background-position: 100% 0; } to { background-position: -50% 0; } }
.island[data-st="needs"] .now { color: #FFB340; } .island[data-st="done"] .now { color: #3EE06A; } .island[data-st="ended"] .now { color: #FF6E66; }
.task { font: 500 12.5px Inter; color: rgba(255,255,255,.46); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* words that arrive one after the other */
.w span { display: inline-block; white-space: pre; animation: wIn .5s var(--soft) both; animation-delay: calc(var(--i) * 24ms); }
@keyframes wIn { from { transform: translateY(7px); opacity: 0; filter: blur(3px); } }

/* the message box */
.msg { position: absolute; display: flex; align-items: center; height: 44px; border-radius: 22px; background: #151517; padding: 0 6px 0 18px; transition: background .25s; z-index: 25; margin: 0; }
.msg:focus-within { background: #1d1d20; }
.msg input { all: unset; flex: 1; min-width: 0; font: 500 14px Inter; color: #fff; caret-color: var(--agl); }
.msg input::placeholder { color: rgba(255,255,255,.34); }
.msg .send { all: unset; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.09); color: rgba(255,255,255,.36); transition: background .25s, color .25s, transform .45s var(--spring); flex: none; }
.msg.has .send { background: var(--ag); color: #fff; } .msg.has .send:hover { transform: scale(1.08); } .msg .send:active { transform: scale(.84); }
.msg .send .ms { font-size: 18px; }

/* quiet actions: an icon, and its name when you are on it */
.ab { all: unset; cursor: pointer; position: relative; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); color: rgba(255,255,255,.72); transition: background .2s, color .2s, transform .45s var(--spring), opacity .3s; flex: none; }
.ab .ms { font-size: 17px; }
.ab:hover { background: rgba(255,255,255,.18); color: #fff; } .ab:active { transform: scale(.88); }
.ab.red { background: color-mix(in srgb, #FF453A 30%, #0c0c0e); color: #ffb3ae; } .ab.red:hover { background: color-mix(in srgb, #FF453A 55%, #0c0c0e); color: #fff; }
.ab.blue { background: color-mix(in srgb, #0A84FF 34%, #0c0c0e); color: #b9dcff; } .ab.blue:hover { background: color-mix(in srgb, #0A84FF 60%, #0c0c0e); color: #fff; }
.ab.green { background: color-mix(in srgb, #30D158 30%, #0c0c0e); color: #b5f5c6; } .ab.green:hover { background: color-mix(in srgb, #30D158 52%, #0c0c0e); color: #fff; }
.ab::after { content: attr(data-l); position: absolute; top: 50%; transform: translateY(-50%) scale(.9); padding: 5px 10px; border-radius: 999px; background: #1e1e21; color: #fff; font: 600 11.5px Inter; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .18s, transform .35s var(--spring); z-index: 60; }
.ab:hover::after { opacity: 1; transform: translateY(-50%) scale(1); }
.ab.tr::after { left: calc(100% + 7px); } .ab.tl::after { right: calc(100% + 7px); }
.ab.tu::after { top: auto; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%) scale(.9); } .ab.tu:hover::after { transform: translateX(-50%) scale(1); }

/* what he needs from you */
.ask .ah { display: block; font: 650 11px Inter; letter-spacing: .02em; color: rgba(255,255,255,.55); margin-bottom: 5px; }
.ask .aq { margin: 0; font: 700 15.5px/1.3 Inter; letter-spacing: -.01em; text-wrap: balance; }
.ask code { font: 600 13.5px ui-monospace, 'Cascadia Code', Consolas, monospace; padding: 4px 9px; border-radius: 9px; background: rgba(0,0,0,.34); display: inline-block; }
.ask .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
.ask .opts button { all: unset; cursor: pointer; box-sizing: border-box; padding: 9px 16px; border-radius: 999px; background: rgba(255,255,255,.15); font: 650 13px Inter; color: #fff; text-align: center; transition: background .2s, color .2s, transform .45s var(--spring); animation: optIn .55s var(--spring) both; animation-delay: calc(var(--i, 0) * 55ms + 120ms); }
@keyframes optIn { from { transform: translateY(12px) scale(.8); opacity: 0; } }
.ask .opts button:hover, .ask .opts button.pressed { background: #fff; color: #111; } .ask .opts button:active, .ask .opts button.pressed { transform: scale(.93); }
.ask .opts .allow { background: #fff; color: #111; } .ask .opts .allow:hover { transform: scale(1.04); }
.ask .opts .skip, .ask .opts .deny { background: rgba(255,255,255,.07); color: rgba(255,255,255,.62); }
.ask .opts .skip { margin-left: auto; }

/* a word from the island (what a click did) */
.toast { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); padding: 8px 15px; border-radius: 999px; background: #1e1e21; font: 600 12px Inter; white-space: nowrap; z-index: 70; animation: toastIn .5s var(--spring) both; pointer-events: none; }
.toast.out { animation: toastOut .25s ease-in forwards; }
@keyframes toastIn { from { transform: translate(-50%, -30px) scale(.8); opacity: 0; } } @keyframes toastOut { to { transform: translate(-50%, -16px); opacity: 0; } }

/* the plan: each step is done, being done, or still to do */
.tk { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.2); transition: background .3s, transform .5s var(--spring); flex: none; }
.tk.done { background: #30D158; } .tk.cur { background: #4DA3FF; animation: tkNow 1.1s ease-in-out infinite; }
@keyframes tkNow { 50% { transform: scale(1.5); } }
.tk.pop { animation: tkPop .6s var(--spring); } @keyframes tkPop { 30% { transform: scale(1.9); } }
.plist { list-style: none; margin: 0; padding: 0; }
.plist li { display: flex; align-items: center; gap: 9px; height: 23px; font: 500 12.5px Inter; color: rgba(255,255,255,.74); white-space: nowrap; }
.plist li span { overflow: hidden; text-overflow: ellipsis; }
.plist li.done { color: rgba(255,255,255,.38); } .plist li.cur { color: #fff; font-weight: 650; }
.plist li .tick { width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); flex: none; transition: background .3s; }
.plist li .tick .ms { font-size: 11px; opacity: 0; transform: scale(.3); transition: opacity .2s, transform .5s var(--spring); font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 20; color: #04210c; }
.plist li.done .tick { background: #30D158; } .plist li.done .tick .ms { opacity: 1; transform: none; }
.plist li.cur .tick { background: #4DA3FF; animation: tkNow 1.1s ease-in-out infinite; }

/* the files he has changed */
.fc { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 6px 9px; border-radius: 999px; background: #151517; font: 600 11.5px Inter; color: rgba(255,255,255,.82); white-space: nowrap; transition: background .2s, transform .45s var(--spring); animation: optIn .5s var(--spring) both; flex: none; }
.fc:hover { background: #222225; } .fc:active { transform: scale(.93); }
.fc .ms { font-size: 14px; color: #6fb6ff; } .fc em { font: 600 10.5px Inter; font-style: normal; color: rgba(255,255,255,.4); }
.frow { all: unset; cursor: pointer; display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 8px; border-radius: 12px; box-sizing: border-box; width: 100%; transition: background .2s; }
.frow:hover { background: rgba(255,255,255,.08); }
.frow .ms { font-size: 16px; color: #6fb6ff; } .frow b { font: 650 12.5px Inter; } .frow small { font: 400 11px Inter; color: rgba(255,255,255,.38); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; } .frow em { font: 600 11px Inter; font-style: normal; color: rgba(255,255,255,.45); }

/* one step of his work */
.sp1 { display: flex; align-items: center; gap: 7px; font: 500 12.5px Inter; color: rgba(255,255,255,.5); white-space: nowrap; min-width: 0; }
.sp1 .ms { font-size: 15px; flex: none; } .sp1 span:last-child { overflow: hidden; text-overflow: ellipsis; }

/* ============================================================ 1 · On stage ============================================================ */
.v1 .who { left: 50%; top: 80px; margin-left: -52px; }
.v1 .side { position: absolute; top: 90px; display: flex; flex-direction: column; gap: 8px; z-index: 30; }
.v1 .side.l { left: 22px; } .v1 .side.r { right: 22px; }
.v1 .side .ab { opacity: 0; transition: background .2s, color .2s, opacity .3s, transform .5s var(--spring); }
.v1 .side.l .ab { transform: translateX(-12px) scale(.8); } .v1 .side.r .ab { transform: translateX(12px) scale(.8); }
.v1:hover .side .ab, .v1.hov .side .ab { opacity: 1; transform: none; }
.v1:hover .side .ab:nth-child(2), .v1.hov .side .ab:nth-child(2) { transition-delay: 0s, 0s, .06s, .06s; }
.v1 .side .ab:active { transform: scale(.88); }
@media (hover: none) { .v1 .side .ab { opacity: 1; transform: none; } }
.v1 .now { position: absolute; left: 28px; right: 28px; top: 201px; text-align: center; }
.v1 .sub { position: absolute; left: 24px; right: 24px; top: 231px; height: 22px; display: flex; align-items: center; justify-content: center; gap: 12px; }
.v1 .sub .task { max-width: 210px; }
.v1 .sub button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font: 600 11.5px Inter; color: rgba(255,255,255,.5); transition: background .2s, color .2s; white-space: nowrap; }
.v1 .sub button:hover, .v1 .sub button.on { background: rgba(255,255,255,.1); color: #fff; }
.v1 .sub button .ms { font-size: 14px; }
.v1 .sub .pl span { margin-left: 3px; }
.v1 .deck { position: absolute; left: 22px; right: 22px; top: 265px; height: 142px; }
.v1 .bub { position: absolute; left: 50%; top: 9px; transform: translateX(-50%); width: max-content; min-width: 150px; max-width: 100%; box-sizing: border-box; background: var(--agd); border-radius: 24px; padding: 13px 18px; transform-origin: 50% -90px; }
.v1 .bub.in { animation: bubIn .7s var(--spring) both; } @keyframes bubIn { from { transform: translateX(-50%) translateY(-34px) scale(.25); opacity: 0; } }
.v1 .bub.out { animation: bubOut .2s ease-in forwards; } @keyframes bubOut { to { transform: translateX(-50%) translateY(-22px) scale(.5); opacity: 0; } }
.v1 .bub .tail { position: absolute; left: 50%; top: -6px; width: 15px; height: 15px; margin-left: -7.5px; background: var(--agd); border-radius: 4px; transform: rotate(45deg); }
.v1 .bub.flat { background: #121214; } .v1 .bub.flat .tail { display: none; }
.v1 .bub .sc { position: relative; max-height: 104px; overflow-y: auto; overscroll-behavior: contain; }
.v1 .bub p { margin: 0; font: 500 13.5px/1.5 Inter; color: rgba(255,255,255,.95); text-wrap: pretty; }
.v1 .bub .old { opacity: .5; padding-bottom: 10px; }
.v1 .bub .y { font-size: 12px; color: rgba(255,255,255,.75); margin-bottom: 3px; } .v1 .bub .y b, .v1 .trail .you b { font-weight: 650; color: var(--agl); margin-right: 6px; }
.v1 .bub .f { font-size: 11px; color: rgba(255,255,255,.6); margin-bottom: 3px; }
.v1 .bub .up { all: unset; cursor: pointer; position: absolute; right: 10px; top: -11px; padding: 4px 9px 4px 6px; border-radius: 999px; background: #232326; font: 600 10.5px Inter; color: rgba(255,255,255,.8); display: flex; align-items: center; gap: 2px; opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .4s var(--spring); }
.v1 .bub .up .ms { font-size: 13px; }
.v1 .bub:hover .up.can { opacity: 1; transform: none; }
.v1 .bub .hdr { display: flex; align-items: center; justify-content: space-between; font: 650 11px Inter; color: rgba(255,255,255,.5); margin-bottom: 4px; }
.v1 .bub .hdr button { all: unset; cursor: pointer; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); } .v1 .bub .hdr button .ms { font-size: 13px; }
.v1 .bub.wide { width: 100%; }
.v1 .bub .ended { display: flex; align-items: center; gap: 14px; } .v1 .bub .ended p { flex: 1; }
.v1 .bub .ended button { all: unset; cursor: pointer; padding: 9px 16px; border-radius: 999px; background: #fff; color: #111; font: 650 13px Inter; display: flex; align-items: center; gap: 5px; transition: transform .45s var(--spring); } .v1 .bub .ended button:hover { transform: scale(1.05); } .v1 .bub .ended button .ms { font-size: 16px; }
.v1 .trail { position: absolute; left: 0; right: 0; top: 4px; }
.v1 .trail .rows { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.v1 .trail .sp1 { max-width: 100%; animation: trIn .5s var(--soft) both; } @keyframes trIn { from { transform: translateY(-20px); opacity: 0; } }
.v1 .trail .sp1:nth-child(2) { color: rgba(255,255,255,.34); } .v1 .trail .sp1:nth-child(3) { color: rgba(255,255,255,.2); }
.v1 .trail .more { font: 500 11px Inter; color: rgba(255,255,255,.26); }
.v1 .trail .you { position: absolute; left: 50%; top: 100px; transform: translateX(-50%); max-width: 100%; box-sizing: border-box; padding: 8px 14px; border-radius: 999px; background: #151517; font: 500 12.5px Inter; color: rgba(255,255,255,.86); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: youIn .6s var(--spring) both; }
@keyframes youIn { from { transform: translateX(-50%) translateY(46px) scale(.8); opacity: 0; } }
.v1 .msg { left: 20px; right: 20px; bottom: 20px; }

/* ============================================================ 2 · Beside him ============================================================ */
.v2 .left { position: absolute; left: 0; top: 60px; bottom: 76px; width: 196px; display: flex; flex-direction: column; align-items: center; }
.v2 .who { position: relative; margin-top: 38px; }
.v2 .left .nm { margin-top: 18px; font: 750 20px Inter; letter-spacing: -.02em; }
.v2 .left .stt { margin-top: 4px; font: 600 12.5px Inter; color: var(--stc); display: flex; align-items: center; gap: 6px; transition: color .3s; }
.v2 .left .stt i { width: 7px; height: 7px; border-radius: 50%; background: var(--stc); transition: background .3s; }
.v2[data-st="working"] .left .stt i { animation: tkNow 1.1s ease-in-out infinite; }
.v2 .left .stats { margin-top: 12px; flex-direction: column; gap: 5px; }
.v2 .acts { margin-top: auto; display: flex; gap: 6px; }
.v2 .acts .ab { width: 34px; height: 34px; }
.v2 .right { position: absolute; left: 208px; right: 26px; top: 66px; bottom: 76px; display: flex; flex-direction: column; min-height: 0; }
.v2 .now { font-size: 18.5px; flex: none; }
.v2 .task { margin-top: 3px; flex: none; }
.v2 .said { position: relative; flex: 1; min-height: 0; margin-top: 14px; }

/* ---------- a mounted version: its timers die with it ---------- */
let M = null, cur = 0;
function newMount() {
  const m = { alive: true, offs: [],
    later(fn, ms) { const id = setTimeout(() => m.alive && fn(), ms); m.offs.push(() => clearTimeout(id)); },
    every(fn, ms) { const id = setInterval(() => m.alive && fn(), ms); m.offs.push(() => clearInterval(id)); },
    on(t, ev, fn, o) { t.addEventListener(ev, fn, o); m.offs.push(() => t.removeEventListener(ev, fn, o)); },
    frame(fn) { let last = performance.now(); const step = t => { if (!m.alive) return; fn(t, Math.min(.05, (t - last) / 1000)); last = t; requestAnimationFrame(step); }; requestAnimationFrame(step); },
    wait: ms => new Promise(r => m.later(r, ms)),
    kill() { m.alive = false; m.offs.forEach(f => f()); } };
  return m;
}

    } };
}
/** What he has said, with what came before it above (scroll up): old turns quiet, the newest reply last. */
function saidHTML(a) {
  return a.turns.map((u, i) => { const last = i === a.turns.length - 1, f = foldLine(u);
    return `<div class="old"><p class="y"><b>You</b>${esc(u.you)}</p>${f ? `<p class="f">${f}</p>` : ''}${u.picks.map(p => `<p class="y"><b>You</b>${esc(p)}</p>`).join('')}${last ? '' : `<p class="r">${esc(u.reply || '')}</p>`}</div>${last ? `<p class="r last w">${words(u.reply || '')}</p>` : ''}`; }).join('');
}
const CLS = { done: 'done', now: 'cur', pending: '' };
const planList = a => a.todos.map(t => `<li class="${CLS[t[1]]}"><i class="tick"><span class="ms">check</span></i><span>${esc(t[0])}</span></li>`).join('');
const doneOf = a => a.todos.filter(t => t[1] === 'done').length;

/* ============================================================ 1 · On stage ============================================================ */
function vStage(m, S) {
  const el = $(`<div class="island v1" style="--w:480px;--h:478px">
    <div class="hd"><span class="mgr"></span><b class="nm"></b><span class="stt"></span><span class="sp"></span><span class="stats"></span>${BACK}</div>
    <div class="side l"></div><div class="side r"></div>
    <div class="who"></div>
    <h3 class="now"></h3>
    <div class="sub"><span class="task"></span><button class="pl" title="The plan"></button><button class="fl" title="The files it changed"></button></div>
    <div class="deck"></div>${MSG}
  </div>`);
  const B = Base(m, S, el, 104), { a, q } = B, deck = q('.deck');
  let sheet = null, key = '';
  const sub = () => {
    q('.task').textContent = a.task;
    const pl = q('.pl'), fl = q('.fl'); pl.style.display = a.todos.length ? '' : 'none'; fl.style.display = a.files.length ? '' : 'none';
    pl.innerHTML = a.todos.map(t => `<i class="tk ${CLS[t[1]]}"></i>`).join('') + `<span>${doneOf(a)} of ${a.todos.length}</span>`; pl.classList.toggle('on', sheet === 'plan');
    fl.innerHTML = `<span class="ms">edit_document</span>${plural(a.files.length, 'file')}`; fl.classList.toggle('on', sheet === 'files');
  };
  function trail(first) {
    const t = S.turn(), tr = deck.querySelector('.trail'); if (!tr) return;
    if (first) tr.querySelector('.you').innerHTML = `<b>You</b>${esc(t.you)}`;
    if (tr._k === t.steps.length) return; tr._k = t.steps.length;
    const rows = t.steps.slice(0, -1).reverse().slice(0, 3), more = t.n - 1 - rows.length;
    tr.querySelector('.rows').innerHTML = rows.map(s => stepRow(s)).join('') + (more > 0 ? `<div class="more">+ ${plural(more, 'earlier step')}</div>` : '');
  }
  function paintDeck() {
    const t = S.turn(), mode = a.status === 'needs' && a.ask ? 'ask' : sheet || (a.status === 'working' ? 'trail' : a.status === 'ended' ? 'ended' : 'words');
    const k = mode === 'ask' ? 'ask' + a.ask.type + (a.ask.i || 0) : mode === 'words' ? 'w' + a.turns.length + '.' + (t.reply || '').length : mode === 'trail' ? 't' + a.turns.length : mode;
    if (k === key) { if (mode === 'trail') trail(false); else if (mode === 'plan') { deck.querySelector('.plist').innerHTML = planList(a); deck.querySelector('.hdr span').textContent = `Plan · ${doneOf(a)} of ${a.todos.length}`; } else if (mode === 'files') files(deck.querySelector('.fl2')); return; }
    key = k;
    for (const o of [...deck.children]) { if (o.classList.contains('bub')) { o.classList.remove('in'); o.classList.add('out'); m.later(() => o.remove(), 200); } else o.remove(); }
    if (mode === 'trail') { deck.append($(`<div class="trail"><div class="rows"></div><div class="you"></div></div>`)); trail(true); return; }
    const bub = $(`<div class="bub in"><i class="tail"></i></div>`);
    if (mode === 'ask') { bub.classList.add('wide'); bub.append(askNode(S)); }
    else if (mode === 'ended') { bub.classList.add('wide'); bub.append($(`<div class="ended"><p>What it did so far is kept. Restart, and it carries on from there.</p><button data-a="restart"><span class="ms">refresh</span>Restart</button></div>`)); }
    else if (mode === 'plan') { bub.classList.add('flat', 'wide'); bub.append($(`<div class="hdr"><span>Plan · ${doneOf(a)} of ${a.todos.length}</span><button data-x title="Close"><span class="ms">close</span></button></div>`), $(`<div class="sc"><ul class="plist">${planList(a)}</ul></div>`)); }
    else if (mode === 'files') { bub.classList.add('flat', 'wide'); const f = $(`<div class="sc fl2"></div>`); bub.append($(`<div class="hdr"><span>Changed files</span><button data-x title="Close"><span class="ms">close</span></button></div>`), f); files(f); }
    else {
      const sc = $(`<div class="sc">${saidHTML(a)}</div>`), up = $(`<button class="up ${a.turns.length > 1 || t.n ? 'can' : ''}"><span class="ms">keyboard_arrow_up</span>Earlier</button>`); bub.append(sc, up); deck.append(bub);
      const last = sc.querySelector('.last'); let grown = false; const fit = () => { if (grown || !sc.isConnected) return; sc.style.height = clamp(last.offsetHeight, 20, 104) + 'px'; sc.scrollTop = last.offsetTop; };
      fit(); const ro = new ResizeObserver(fit); ro.observe(last); m.offs.push(() => ro.disconnect());
      up.addEventListener('click', () => { grown = true; sc.style.height = '104px'; sc.scrollTo({ top: Math.max(0, sc.scrollTop - 96), behavior: 'smooth' }); });
      return;
    }
    deck.append(bub);
  }
  const files = f => { f.innerHTML = a.files.map((x, i) => `<button class="frow" data-f="${i}"><span class="ms">edit_document</span><b>${esc(x.n)}</b><small>${esc(x.d)}</small><em>${plural(x.e, 'edit')}</em></button>`).join(''); };
  q('.pl').addEventListener('click', () => { sheet = sheet === 'plan' ? null : 'plan'; sub(); paintDeck(); });
  q('.fl').addEventListener('click', () => { sheet = sheet === 'files' ? null : 'files'; sub(); paintDeck(); });
  deck.addEventListener('click', e => { if (e.target.closest('[data-x]')) { sheet = null; sub(); paintDeck(); } });
  const paint = (ev, d) => {
    if (B.common(ev, d)) return;
    if (ev === 'ask' || ev === 'send' || ev === 'reply' || ev === 'reset') sheet = ev === 'reset' ? S.sheet0 || null : null;
    q('.nm').textContent = a.name; q('.stt').textContent = STT[a.status]; q('.stats').innerHTML = B.stats();
    B.acts(A => { q('.side.l').innerHTML = A.slice(0, 2).map(f => f('tr')).join(''); q('.side.r').innerHTML = A.slice(2).map(f => f('tl')).join(''); });
    B.now(q('.now')); sub(); if (ev === 'plan') q('.pl').children[d]?.classList.add('pop'); paintDeck();
  };
  S.on(paint);
  return el;
}

/* ============================================================ 2 · Beside him ============================================================ */
function vBeside(m, S) {
  const el = $(`<div class="island v2" style="--w:520px;--h:456px">
    <div class="hd"><span class="mgr"></span><span class="path"></span><span class="sp"></span>${BACK}</div>
    <div class="left"><div class="who"></div><b class="nm"></b><span class="stt"><i></i><span></span></span><div class="stats"></div><div class="acts"></div></div>
    <div class="right"><h3 class="now"></h3><div class="task"></div><div class="said"><div class="sc"></div></div><div class="plan"><small class="lb"></small><ul class="plist"></ul></div><div class="files"></div></div>${MSG}
  </div>`);
  const B = Base(m, S, el, 116), { a, q } = B, sc = q('.said .sc');
  let key = '', fkey = '', ro = null; m.offs.push(() => ro?.disconnect());
  document.fonts.ready.then(() => { if (m.alive) { fkey = ''; files(); } });
  function said() {
    const t = S.turn(), mode = a.status === 'needs' && a.ask ? 'ask' : a.status === 'working' ? 'work' : 'words';
    const k = mode === 'ask' ? 'ask' + a.ask.type + (a.ask.i || 0) : mode === 'words' ? 'w' + a.status + a.turns.length + '.' + (t.reply || '').length : 't' + a.turns.length + '.' + t.steps.length;
    if (k === key) return; key = k;
    if (mode === 'ask') { sc.innerHTML = ''; sc.append(askNode(S)); sc.scrollTop = 0; return; }
    if (mode === 'work') { const rows = t.steps.slice(0, -1).reverse().slice(0, 3), more = t.n - 1 - rows.length;
      sc.innerHTML = `<p class="y"><b>You</b>${esc(t.you)}</p>` + rows.map(s => stepRow(s)).join('') + (more > 0 ? `<div class="sp1" style="opacity:.6"><span class="ms">more_horiz</span><span>${plural(more, 'earlier step')}</span></div>` : ''); sc.scrollTop = 0; return; }
    sc.innerHTML = saidHTML(a) + (a.status === 'ended' ? `<div class="ended"><button data-a="restart"><span class="ms">refresh</span>Restart</button><p class="f" style="margin:0">What it did so far is kept.</p></div>` : '') + `<div class="pad"></div>`;
    const last = sc.querySelector('.last'), pad = sc.querySelector('.pad'), fit = () => { if (!last.isConnected) return; pad.style.height = '0px'; pad.style.height = Math.max(0, sc.clientHeight - (sc.scrollHeight - last.offsetTop)) + 'px'; sc.scrollTop = last.offsetTop; };
    fit(); ro?.disconnect(); ro = new ResizeObserver(fit); ro.observe(last);
  }
  function files() {
    const k = a.files.map(f => f.n + f.e).join(); if (k === fkey) return; fkey = k; const f = q('.files'); f.style.display = a.files.length ? '' : 'none';
    f.innerHTML = a.files.map((x, i) => `<button class="fc" data-f="${i}" title="${esc(x.d)}\\${esc(x.n)}" style="--i:${i}"><span class="ms">edit_document</span>${esc(x.n)}<em>${x.e}</em></button>`).join('');
    let n = a.files.length; while (f.scrollWidth > f.clientWidth && n > 1) { f.children[--n].remove(); f.querySelector('.more')?.remove(); f.append($(`<span class="fc more" style="cursor:default">+${a.files.length - n}</span>`)); }
  }
  const paint = (ev, d) => {
    if (B.common(ev, d)) return;
    q('.path').textContent = a.path; q('.nm').textContent = a.name; q('.stt span').textContent = STT[a.status];
    q('.stats').innerHTML = `<span>${a.model} · ${a.age}</span><span class="ctx"><i style="--f:${Math.min(100, a.ctx / 10)}%"></i>${Math.round(a.ctx)}k context${a.cost ? ` · $${a.cost.toFixed(2)}` : ''}</span>`;
    B.acts(A => { q('.acts').innerHTML = A.map(f => f('tu')).join(''); });
    B.now(q('.now')); q('.task').textContent = a.task;
    q('.plan').style.display = a.todos.length ? '' : 'none'; q('.plan .lb').textContent = `Plan · ${doneOf(a)} of ${a.todos.length}`; q('.plist').innerHTML = planList(a);
    files(); said();
  };
  S.on(paint);
  return el;
}

/* ============================================================ 3 · Talking with him ============================================================ */
function vTalk(m, S) {
  const el = $(`<div class="island v3" style="--w:500px;--h:480px">
    <div class="hd"><span class="mgr"></span><b class="nm"></b><span class="stt"></span><span class="sp"></span><span class="stats"></span>${BACK}</div>
    <div class="talk"><div class="sc"></div></div>
    <div class="big"></div>
    <div class="planrow"><span class="segs"></span><small></small></div>
    <div class="who"></div>${MSG}
    <div class="under"><span class="path"></span><span class="acts"></span></div>
  </div>`);
  const B = Base(m, S, el, 92), { a, q } = B, sc = q('.talk .sc'), host = q('.big');
  let nodes = [], bkey = '';
  const stick = () => sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' });
  function upd(N) {
    const t = N.t, live = t === S.turn() && a.status === 'working';
    N.fold.style.display = t.n > 0 || live ? '' : 'none'; N.fold.classList.toggle('open', N.open);
    N.fold.querySelector('.ic').textContent = live ? ICON[a.tool] || 'more_horiz' : 'done_all';
    const lv = N.fold.querySelector('.lv'); lv.style.display = live ? '' : 'none'; if (live && lv.textContent !== a.now) { lv.textContent = a.now; }
    N.fold.querySelector('.ct').textContent = live ? (t.n ? '· ' + plural(t.n, 'step') + ' · ' : '· ') + S.dur(t) : foldLine(t);
    N.steps.classList.toggle('open', N.open);
    if (N.open) { const k = t.steps.length + '.' + t.fl.length; if (N.sk !== k) { N.sk = k; const more = t.n - t.steps.length;
      N.steps.innerHTML = (more > 0 ? `<div class="more">+ ${plural(more, 'earlier step')}</div>` : '') + t.steps.slice(-6).map(s => stepRow(s)).join('') + (t.fl.length ? `<div class="fs">${t.fl.map(n => { const i = a.files.findIndex(f => f.n === n), f = a.files[i]; return f ? `<button class="fc" data-f="${i}"><span class="ms">edit_document</span>${esc(f.n)}<em>${f.e}</em></button>` : ''; }).join('')}</div>` : ''); } }
    while (N.picks < t.picks.length) { const p = $(`<p class="y"></p>`); p.textContent = t.picks[N.picks++]; (N.r || N.end) ? sc.insertBefore(p, N.r || N.end) : sc.append(p); }
    if (t.reply && !N.r) { N.r = $(`<p class="r w">${words(t.reply)}</p>`); N.end ? sc.insertBefore(N.r, N.end) : sc.append(N.r); }
    const ended = t === S.turn() && a.status === 'ended';
    if (ended && !N.end) { N.end = $(`<div class="endrow"><span class="ms">error</span><span>${esc(a.err || 'It stopped')}. What it did so far is kept.</span><button data-a="restart">Restart</button></div>`); sc.append(N.end); } else if (!ended && N.end) { N.end.remove(); N.end = null; }
  }
  function node(t) {
    const N = { t, open: false, picks: 0, r: null, end: null, sk: '' };
    N.y = $(`<p class="y"></p>`); N.y.textContent = t.you;
    N.fold = $(`<button class="fold" title="Its steps"><span class="ms ic"></span><span class="lv"></span><span class="ct"></span><span class="ms cv">expand_more</span></button>`); N.steps = $(`<div class="steps"></div>`);
    N.fold.addEventListener('click', () => { N.open = !N.open; upd(N); if (N.t === S.turn()) stick(); });
    sc.append(N.y, N.fold, N.steps); upd(N); return N;
  }
  function big() {
    const need = a.status === 'needs' && a.ask, k = need ? a.ask.type + (a.ask.i || 0) : '';
    if (k === bkey) return; bkey = k; const old = host.firstElementChild; if (old) { old.classList.add('out'); m.later(() => old.remove(), 220); }
    el.classList.toggle('asking', !!need); if (need) host.append(askNode(S));
  }
  const lab = () => { q('.planrow small').textContent = a.todos.length ? `${a.task} · ${doneOf(a)} of ${a.todos.length}` : a.task; };
  q('.planrow').addEventListener('mouseover', e => { const i = e.target.dataset && e.target.dataset.t; if (i !== undefined) q('.planrow small').textContent = `${+i + 1}. ${a.todos[i][0]}`; });
  q('.planrow').addEventListener('mouseout', lab);
  m.every(() => { const N = nodes[nodes.length - 1]; if (N && a.status === 'working') upd(N); }, 1000);
  document.fonts.ready.then(() => { if (m.alive) sc.scrollTop = sc.scrollHeight; });
  const paint = (ev, d) => {
    if (B.common(ev, d)) return;
    q('.nm').textContent = a.name; q('.stt').textContent = STT[a.status]; q('.stats').innerHTML = B.stats(); q('.path').textContent = a.path;
    B.acts(A => { q('.acts').innerHTML = A.map(f => f('tu')).join(''); });
    q('.segs').innerHTML = a.todos.map((t, i) => `<i class="${CLS[t[1]]}" data-t="${i}" style="width:${Math.min(30, 150 / a.todos.length)}px"></i>`).join(''); lab();
    if (ev === 'reset') { sc.innerHTML = ''; nodes = a.turns.map(node); sc.scrollTop = sc.scrollHeight; bkey = '~'; }
    while (nodes.length < a.turns.length) nodes.push(node(a.turns[nodes.length]));
    nodes.slice(-2).forEach(upd); big(); if (ev !== 'reset') stick();
  };
  S.on(paint);
  return el;
}

/* ---------- the page ---------- */
const VERSIONS = [
  { n: 'On stage', rec: true, f: vStage, p: 'He is the screen. The agent’s own Bloub stands in the middle and acts what it is doing: a magnifier while it reads, a page while it edits, an hourglass while a command runs, a padlock when it wants your permission, a hand up when it has a question. One line says it in words, his last words come out of him as a bubble, and the buttons wait until your pointer is on the island.' },
  { n: 'Beside him', f: vBeside, p: 'He stands on the left, tall, with his name, his state and what he has used under him. On the right, one calm column and no boxes: what he is doing, what he said, the plan ticking off, the files he changed. The actions are four quiet icons under him.' },
  { n: 'Talking with him', f: vTalk, p: 'A conversation in turns: what you asked, one folded line for all the work it took (open it to see the steps and the files), and his answer. He sits at the bottom beside the message box and acts while the newest turn grows above him. When he needs you, his question takes the whole screen, with big answers.' },
];
const STATES = [['idle', 'Idle'], ['working', 'Working'], ['perm', 'Needs permission'], ['q', 'Has a question'], ['done', 'Done'], ['ended', 'Stopped']];
const picker = document.getElementById('picker'), stage = document.getElementById('stage'), tools = document.getElementById('tools'), qs = new URLSearchParams(location.search);
let kind = qs.get('kind') === 'terminal' ? 'terminal' : 'island', colorAt = clamp(+qs.get('c') || 0, 0, PAL.length - 1), SIM = null, stNow = null;
VERSIONS.forEach((v, i) => { const b = $(`<button><kbd>${i + 1}</kbd>${v.n}${v.rec ? '<em>my pick</em>' : ''}</button>`); b.addEventListener('click', () => mount(i, stNow)); picker.append(b); });
tools.innerHTML = `<button id="demo"><span class="ms">play_arrow</span>Play it for me</button><span class="sep"></span>${STATES.map(s => `<button data-st="${s[0]}">${s[1]}</button>`).join('')}<span class="sep"></span><button id="kind"></button><span class="sep"></span>${PAL.map((c, i) => `<button class="sw" data-c="${i}" style="--c:${c}" title="Another agent"></button>`).join('')}`;
const paintTools = () => { tools.querySelectorAll('[data-st]').forEach(b => b.classList.toggle('on', b.dataset.st === stNow)); tools.querySelectorAll('.sw').forEach((b, i) => b.classList.toggle('on', i === colorAt));
  document.getElementById('kind').innerHTML = `<span class="ms">${kind === 'island' ? 'auto_awesome' : 'terminal'}</span>${kind === 'island' ? 'Launched from the island' : 'Runs in your terminal'}`; };
function mount(i, st = null, au = false) {
  if (M) M.kill(); M = newMount(); cur = i; stNow = st; stage.innerHTML = '';
  SIM = Sim(M, kind, PAL[colorAt]); SIM.sheet0 = qs.get('sheet');
  const el = VERSIONS[i].f(M, SIM); if (qs.get('hover')) el.classList.add('hov'); stage.append(el);
  picker.querySelectorAll('button').forEach((b, j) => b.classList.toggle('on', j === i));
  document.getElementById('bh').textContent = `${i + 1} · ${VERSIONS[i].n}`; document.getElementById('bp').textContent = VERSIONS[i].p;
  paintTools(); if (st) SIM.jump(st, au); else SIM.demo();
}
tools.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'demo') mount(cur); else if (b.dataset.st) mount(cur, b.dataset.st); else if (b.id === 'kind') { kind = kind === 'island' ? 'terminal' : 'island'; mount(cur, stNow); } else if (b.dataset.c) { colorAt = +b.dataset.c; mount(cur, stNow); }
});
document.addEventListener('keydown', e => { if (e.target.closest('textarea, input, [contenteditable]')) return; const n = +e.key; if (n >= 1 && n <= VERSIONS.length) mount(n - 1, stNow); });
mount(clamp((+qs.get('v') || 1) - 1, 0, VERSIONS.length - 1), qs.get('st'), !!qs.get('auto'));

</script>
