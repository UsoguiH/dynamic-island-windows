<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-25..200&display=block" rel="stylesheet">
<style>
:root {
  --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
  --soft: linear(0, 0.06 3%, 0.23 7.4%, 0.55 14.6%, 0.81 22.4%, 0.94 29.6%, 1.01 37.4%, 1.03 44.6%, 1.02 55%, 1);
  --page: #e9e6f2; --ink: #1d1b22; --sub: #4a4655;
  --blue: #0A84FF; --green: #30D158;
  /* a calm spring: ~1% overshoot, no visible bounce */
  --smooth: linear(0.000, 0.021, 0.076, 0.151, 0.238, 0.329, 0.419, 0.506, 0.586, 0.659, 0.724, 0.780, 0.828, 0.868, 0.902, 0.929, 0.951, 0.968, 0.982, 0.992, 0.999, 1.004, 1.008, 1.010, 1.011, 1.011, 1.011, 1.010, 1.009, 1.008, 1.007, 1.006, 1.005, 1.005, 1.004, 1.003, 1.002, 1.002, 1.001, 1.001, 1);
  --k: 1; /* slow motion multiplies every duration */
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #15131b; --ink: #f1eff6; --sub: #a9a4b6; } }
:root[data-theme="dark"] { --page: #15131b; --ink: #f1eff6; --sub: #a9a4b6; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: var(--ink); overflow-x: hidden;
  background:
    radial-gradient(60% 50% at 12% 18%, #9fb0ff 0%, transparent 60%),
    radial-gradient(50% 45% at 88% 14%, #ffa9cf 0%, transparent 60%),
    radial-gradient(55% 50% at 72% 88%, #ffd29b 0%, transparent 62%),
    radial-gradient(50% 50% at 18% 90%, #95e8da 0%, transparent 60%),
    var(--page);
}
.page { max-width: 1100px; margin: 0 auto; padding: 22px 16px 60px; display: flex; flex-direction: column; align-items: center; }
.picker { display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(20, 18, 26, .9); box-shadow: 0 10px 30px rgba(40, 20, 80, .25); flex-wrap: wrap; justify-content: center; }
.picker button { all: unset; cursor: pointer; padding: 9px 16px; border-radius: 999px; color: rgba(255,255,255,.62); font: 600 13px Inter; display: flex; gap: 8px; align-items: center; transition: background .25s, color .25s; }
.picker button:hover { color: #fff; }
.picker button.on { background: #fff; color: #111; }
.picker kbd { font: 600 10px Inter; opacity: .5; border: 1px solid currentColor; border-radius: 5px; padding: 1px 5px; }
.blurb { margin: 14px 0 22px; text-align: center; max-width: 760px; }
.blurb h2 { margin: 0 0 6px; font: 700 22px Inter; letter-spacing: -.02em; }
.blurb p { margin: 0; font: 400 14px/1.5 Inter; color: var(--sub); }
.stage { width: 100%; display: flex; justify-content: center; }
.tools { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; font: 500 12.5px Inter; color: var(--sub); }
.tools button { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 999px; background: rgba(20, 18, 26, .86); color: #fff; font: 600 12.5px Inter; display: flex; gap: 6px; align-items: center; }
.tools button:hover { background: #000; }
.tools .ms { font-size: 17px; }

/* ---------- the island ---------- */
.scale { width: 724px; max-width: 100%; }
.island { position: relative; width: 724px; height: 404px; border-radius: 46px; background: #000; color: #fff; overflow: hidden; transform-origin: top left;
  box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 24px 70px rgba(70, 40, 160, .35), 0 6px 18px rgba(0,0,0,.25); }
@media (max-width: 760px) { .scale { height: calc((100vw - 32px) / 724 * 404); } .island { transform: scale(calc((100vw - 32px) / 724px)); } }
.top { position: absolute; left: 26px; right: 22px; top: 18px; height: 40px; display: flex; align-items: center; gap: 10px; }
.top .tabs { display: flex; gap: 4px; margin-left: 24px; flex: 1; }
.top .tab { padding: 7px 12px; border-radius: 999px; font: 600 13px Inter; color: rgba(255,255,255,.55); }
.top .tab.on { background: rgba(255,255,255,.14); color: #fff; }
.top .avs { display: flex; padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,.08); }
.top .avs svg { margin-left: -5px; }
.top .edit { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); }
.top .edit .ms { font-size: 18px; }
.panel { position: absolute; left: 20px; right: 20px; top: 70px; bottom: 20px; }

.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; display: inline-block; white-space: nowrap; -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; user-select: none; }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 30px); opacity: 0; padding: 8px 14px; border-radius: 999px; background: #1c1c22; font: 600 12px Inter; transition: transform .45s var(--spring), opacity .25s; pointer-events: none; white-space: nowrap; z-index: 9; }
.toast.on { transform: translate(-50%, 0); opacity: 1; }
input { all: unset; font: 600 14px Inter; color: #fff; caret-color: var(--blue); min-width: 0; }
input::placeholder { color: rgba(255,255,255,.38); font-weight: 500; }

/* ---------- shared task rows ---------- */
.list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; scrollbar-width: none; min-height: 0; }
.list::-webkit-scrollbar { display: none; }
.task { position: relative; display: flex; align-items: center; gap: 12px; height: 40px; flex: none; padding: 0 10px 0 12px; border-radius: 14px; background: rgba(255,255,255,.055); cursor: pointer; transition: background .2s; }
.task:hover { background: rgba(255,255,255,.09); }
.task .box { width: 20px; height: 20px; flex: none; position: relative; }
.task .box svg { position: absolute; inset: 0; overflow: visible; }
.task .ring { fill: none; stroke: rgba(255,255,255,.4); stroke-width: 1.6; transition: stroke .2s; }
.task:hover .ring { stroke: rgba(255,255,255,.75); }
.task .dot { fill: var(--green); transform-origin: 10px 10px; transform: scale(0); }
.task .tick { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 12; stroke-dashoffset: 12; }
.task.done .dot { transform: scale(1); }
.task.done .tick { stroke-dashoffset: 0; }
.task .t { position: relative; flex: 0 1 auto; min-width: 0; font: 600 13.5px Inter; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .35s; }
.task .t .strike { position: absolute; left: 0; top: 50%; height: 1.3px; background: rgba(255,255,255,.4); width: 100%; transform: scaleX(0); transform-origin: left; }
.task.done .t { color: rgba(255,255,255,.38); font-weight: 500; }
.task.done .t .strike { transform: scaleX(1); }
.task .x { all: unset; margin-left: auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; opacity: 0; transition: opacity .2s, background .2s; color: rgba(255,255,255,.6); }
.task:hover .x { opacity: 1; }
.task .x:hover { background: rgba(255,69,58,.25); color: #ff8a80; }
.task .x .ms { font-size: 16px; }
.donehd { font: 600 11.5px Inter; color: rgba(255,255,255,.38); padding: 6px 4px 0; display: flex; justify-content: space-between; align-items: center; flex: none; }
.donehd button { all: unset; cursor: pointer; font: 600 11.5px Inter; color: rgba(255,255,255,.55); padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.07); }
.donehd button:hover { background: rgba(255,255,255,.14); color: #fff; }
.allclear { margin: auto; text-align: center; color: rgba(255,255,255,.45); font: 500 12.5px Inter; }
.allclear b { display: block; color: #fff; font: 600 15px Inter; margin: 10px 0 4px; }

/* ============ A · plus → field ============ */
.A { height: 100%; display: flex; flex-direction: column; gap: 12px; }
.A .bar { position: relative; display: flex; align-items: center; gap: 10px; height: 44px; flex: none; }
.A .barwrap { flex: 1; height: 44px; }
.A .count { font: 650 20px Inter; letter-spacing: -.02em; display: flex; align-items: baseline; gap: 8px; padding-left: 4px; white-space: nowrap;
  transition: opacity calc(.34s * var(--k)) ease, transform calc(.7s * var(--k)) var(--smooth), filter calc(.34s * var(--k)) ease; }
.A .count small { font: 500 12px Inter; color: rgba(255,255,255,.42); letter-spacing: 0; }
.A.editing .count { opacity: 0; transform: translateX(-10px); filter: blur(2px); pointer-events: none; }
/* the pill: its right edge stays put and it grows left; the blue drains into the outline as it opens */
.A .add { position: absolute; right: 0; top: 0; height: 44px; width: 132px; border-radius: 22px; overflow: hidden; cursor: pointer;
  background-color: var(--blue); box-shadow: inset 0 0 0 1.5px rgba(10,132,255,0);
  transition: width calc(.72s * var(--k)) var(--smooth), background-color calc(.55s * var(--k)) ease, box-shadow calc(.55s * var(--k)) ease; }
.A .add:hover:not(.open) { background-color: #2b93ff; }
.A .add .plus { position: absolute; left: 13px; top: 12px; font-size: 20px; color: #fff;
  transition: transform calc(.72s * var(--k)) var(--smooth), color calc(.45s * var(--k)) ease; }
.A .add .label { position: absolute; left: 42px; top: 13px; font: 600 13.5px Inter; white-space: nowrap;
  transition: opacity calc(.22s * var(--k)) ease, transform calc(.6s * var(--k)) var(--smooth), filter calc(.22s * var(--k)) ease; }
.A .add input { position: absolute; left: 42px; right: 50px; top: 0; height: 44px; opacity: 0; transform: translateX(-6px); pointer-events: none;
  transition: opacity calc(.3s * var(--k)) ease, transform calc(.6s * var(--k)) var(--smooth); }
.A .add .send { all: unset; position: absolute; right: 6px; top: 6px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  background: rgba(255,255,255,.1); color: rgba(255,255,255,.4); opacity: 0; transform: scale(.6);
  transition: transform calc(.6s * var(--k)) var(--smooth), opacity calc(.25s * var(--k)) ease, background calc(.3s * var(--k)) ease, color calc(.3s * var(--k)) ease; }
.A .add .send .ms { font-size: 18px; }
.A.editing .add { width: 100%; cursor: text; background-color: #1c1c20; box-shadow: inset 0 0 0 1.5px rgba(10,132,255,.7); }
.A.editing .add .plus { transform: rotate(180deg); color: var(--blue); }
.A.editing .add .label { opacity: 0; transform: translateX(14px); filter: blur(2px); }
.A.editing .add input { opacity: 1; transform: none; pointer-events: auto; transition-delay: calc(.12s * var(--k)), 0s; }
.A.editing .add .send { opacity: 1; transform: scale(1); transition-delay: calc(.2s * var(--k)); }
.A .add.ready .send { background: var(--blue); color: #fff; }

/* ============ B · ghost row ============ */
.B { height: 100%; display: flex; flex-direction: column; gap: 10px; }
.B .hd { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; flex: none; }
.B .hd b { font: 650 20px Inter; letter-spacing: -.02em; }
.B .hd small { font: 500 12px Inter; color: rgba(255,255,255,.42); margin-left: 8px; }
.B .ghost { position: relative; display: flex; align-items: center; gap: 12px; height: 40px; flex: none; padding: 0 10px 0 11px; border-radius: 14px; cursor: text;
  background: transparent; border: 1.5px dashed rgba(255,255,255,.16); transition: background .3s, border-color .3s; }
.B .ghost:hover { background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.28); }
.B .ghost .pl { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: var(--blue); flex: none; transition: transform .5s var(--spring); }
.B .ghost .pl .ms { font-size: 20px; }
.B .ghost input { flex: 1; font-weight: 500; }
.B .ghost .hint { font: 600 11px Inter; color: rgba(255,255,255,.35); display: flex; gap: 4px; align-items: center; opacity: 0; transform: translateX(6px); transition: opacity .25s, transform .4s var(--spring); white-space: nowrap; }
.B .ghost .hint kbd { font: 600 10.5px Inter; border-radius: 6px; padding: 2px 6px; background: rgba(255,255,255,.1); color: rgba(255,255,255,.7); }
.B .ghost.on { background: rgba(10,132,255,.08); border: 1.5px solid rgba(10,132,255,.65); }
.B .ghost.on .pl { transform: rotate(90deg) scale(.9); }
.B .ghost.on input { font-weight: 600; }
.B .ghost.ready .hint { opacity: 1; transform: none; }
.B .peek { position: absolute; right: 86px; top: -15px; pointer-events: none; transition: transform .6s var(--spring), opacity .3s; transform: translateY(18px) scale(.6); opacity: 0; }
.B .ghost.on .peek { transform: none; opacity: 1; }

/* ============ C · Bloub tosses it ============ */
.C { height: 100%; display: flex; flex-direction: column; gap: 10px; }
.C .hd { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; flex: none; }
.C .hd b { font: 650 20px Inter; letter-spacing: -.02em; }
.C .hd small { font: 500 12px Inter; color: rgba(255,255,255,.42); margin-left: 8px; }
.C .list { flex: 1; }
.C .composer { flex: none; height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 7px 0 8px; border-radius: 25px; background: #17171b; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.08); transition: box-shadow .3s; position: relative; }
.C .composer:focus-within { box-shadow: inset 0 0 0 1.5px rgba(10,132,255,.65); }
.C .composer input { flex: 1; }
.C .composer .bl { flex: none; transform-origin: 50% 100%; display: block; }
.C .composer .send { all: unset; cursor: pointer; height: 36px; padding: 0 14px 0 12px; border-radius: 18px; display: flex; gap: 6px; align-items: center; background: rgba(255,255,255,.08); color: rgba(255,255,255,.4); font: 600 12.5px Inter; transition: background .25s, color .25s, transform .3s var(--spring); }
.C .composer .send .ms { font-size: 17px; }
.C .composer.ready .send { background: var(--blue); color: #fff; }
.C .composer .send:active { transform: scale(.93); }
.fly { position: absolute; z-index: 5; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 14px; background: #2a2a31; font: 600 13.5px Inter; white-space: nowrap; pointer-events: none; box-shadow: 0 10px 24px rgba(0,0,0,.5); }
.fly i { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1.6px rgba(255,255,255,.4); flex: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <radialGradient id="bloubShade" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#e7e7ee"/><stop offset="1" stop-color="#b9b9c4"/></radialGradient>
</defs></svg>

<div class="page">
  <nav class="picker" id="picker"></nav>
  <div class="blurb"><h2 id="dTitle"></h2><p id="dText"></p></div>
  <div class="stage"><div class="scale"><div class="island" id="island">
    <div class="top">
      <span id="face"></span>
      <div class="tabs"><span class="tab">Overview</span><span class="tab">Agents</span><span class="tab">Servers</span><span class="tab on">Tasks</span></div>
      <div class="avs" id="avs"></div>
      <div class="edit"><span class="ms">edit</span></div>
    </div>
    <div class="panel" id="panel"></div>
    <div class="toast" id="toast"></div>
  </div></div></div>
  <div class="tools">
    <button id="reset"><span class="ms">refresh</span>Reset tasks</button>
    <button id="slow"><span class="ms">slow_motion_video</span><span>Slow motion: off</span></button>
    <span>Type for real · Enter adds · Esc closes · click a task to tick it</span>
  </div>
</div>

<script>
if (location.search.includes('still')) document.head.insertAdjacentHTML('beforeend', '<style>*,*::before,*::after{transition:none!important;animation:none!important}</style>');
const SPRING = getComputedStyle(document.documentElement).getPropertyValue('--spring').trim();
const SOFT = getComputedStyle(document.documentElement).getPropertyValue('--soft').trim();
const SMOOTH = getComputedStyle(document.documentElement).getPropertyValue('--smooth').trim();
let K = 1; // slow motion
const $ = (s, r = document) => r.querySelector(s);
const ms = n => `<span class="ms">${n}</span>`;
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function bloub(size, color, cls = '') {
  const body = color || 'url(#bloubShade)';
  const shade = color ? `<circle cx="20" cy="20" r="19" fill="url(#bloubShade)" opacity=".22"/>` : '';
  return `<svg class="bloub ${cls}" width="${size}" height="${size}" viewBox="0 0 40 40" style="overflow:visible"><circle cx="20" cy="20" r="19" fill="${body}"/>${shade}
    <g class="eyes" style="transition:transform .45s var(--soft)"><rect x="13.2" y="12.5" width="4.6" height="10.5" rx="2.3" fill="#0b0b10" transform="rotate(8 15.5 17.75)"/><rect x="22.2" y="12" width="4.6" height="10.5" rx="2.3" fill="#0b0b10" transform="rotate(8 24.5 17.25)"/></g></svg>`;
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1600); }

/* ---------- data ---------- */
let uid = 10;
const START = () => [
  { id: 1, text: 'Review the dark-mode PR', done: false },
  { id: 2, text: 'Reply to design feedback', done: false },
  { id: 3, text: 'Ship notes-cli 2.1', done: false },
  { id: 4, text: 'Fix flaky auth tests', done: true },
];
let tasks = START();
const HINTS = ['Buy oat milk', 'Call the dentist', 'Send the invoice', 'Water the plants', 'Book flights for May'];

/* ---------- rows ---------- */
function row(t) {
  return `<div class="task${t.done ? ' done' : ''}" data-id="${t.id}">
    <span class="box"><svg viewBox="0 0 20 20"><circle class="ring" cx="10" cy="10" r="8.6"/><circle class="dot" cx="10" cy="10" r="10"/><path class="tick" d="M6 10.4l2.7 2.6L14.2 7.4"/></svg></span>
    <span class="t">${esc(t.text)}<i class="strike"></i></span>
    <button class="x" data-del="${t.id}" title="Delete">${ms('close')}</button></div>`;
}
function listHTML() {
  const todo = tasks.filter(t => !t.done), done = tasks.filter(t => t.done);
  if (!tasks.length) return `<div class="allclear">${bloub(42)}<b>All clear</b>Nothing on your list</div>`;
  return todo.map(row).join('') + (done.length ? `<div class="donehd" data-id="donehd"><span>Done · ${done.length}</span><button data-clear>Clear</button></div>` + done.map(row).join('') : '');
}
/* FLIP: everything that moves glides to its new place */
function flip(list, mutate) {
  const before = new Map();
  list.querySelectorAll('[data-id]').forEach(el => before.set(el.dataset.id, el.getBoundingClientRect().top));
  mutate();
  list.querySelectorAll('[data-id]').forEach(el => {
    const b = before.get(el.dataset.id);
    if (b == null) return;
    const dy = b - el.getBoundingClientRect().top;
    if (Math.abs(dy) > 0.5) el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 600 * K, easing: SMOOTH });
  });
}
function counts() { const n = tasks.filter(t => !t.done).length; return n ? `${n} to do` : 'all done'; }

/* the done animation: ring → green dot that pops, tick draws, line strikes through; then the row glides down */
function tick(el, t) {
  const done = !t.done;
  t.done = done;
  const dot = $('.dot', el), tk = $('.tick', el), st = $('.strike', el), tx = $('.t', el);
  el.classList.toggle('done', done);
  if (done) {
    dot.animate([{ transform: 'scale(0)' }, { transform: 'scale(1)' }], { duration: 520 * K, easing: SPRING });
    tk.animate([{ strokeDashoffset: 12 }, { strokeDashoffset: 0 }], { duration: 320, delay: 140, easing: 'cubic-bezier(.3,0,.2,1)', fill: 'backwards' });
    st.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 380, delay: 120, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'backwards' });
    el.animate([{ transform: 'scale(1)' }, { transform: 'scale(.985)' }, { transform: 'scale(1)' }], { duration: 300 });
    hop();
  }
  setTimeout(() => refresh(), (done ? 650 : 120) * K);
}

/* ---------- designs ---------- */
const DESIGNS = [
  { id: 'A', name: 'Plus opens the field', title: 'A · The + button opens into the field',
    text: 'Smoother now: the pill grows into the field in one calm motion (a spring with about 1% overshoot, no bounce), its blue drains into the outline, “New task” fades as the placeholder slides in, and the send button grows in last. Enter makes room at the top and the task rises into it. Try Slow motion below to judge it.' },
  { id: 'B', name: 'Add row in the list', title: 'B · An “add” row inside the list',
    text: 'The last row of the list is a dashed “Add a task” row. Click it and it becomes the row you’re typing; Bloub peeks over its edge to watch. Enter turns it into a real task right where it is, and a fresh add row slides in below so you can keep going.' },
  { id: 'C', name: 'Bloub tosses it', title: 'C · Bloub tosses it onto the list',
    text: 'A composer along the bottom with Bloub at its side, like a chat. Type and press Enter: Bloub crouches and tosses your task up in an arc, and it lands at the top of the list while the others make room. He watches the list and does a little hop whenever you tick something off.' },
];
let design = 'A', hopTarget = null;

function hop() {
  const b = hopTarget?.(); if (!b) return;
  b.animate([
    { transform: 'translateY(0) scale(1, 1)' },
    { transform: 'translateY(0) scale(1.12, .84)', offset: .18 },
    { transform: 'translateY(-11px) scale(.94, 1.08)', offset: .45 },
    { transform: 'translateY(0) scale(1.08, .9)', offset: .75 },
    { transform: 'translateY(0) scale(1, 1)' },
  ], { duration: 620, easing: 'ease-out' });
}

function renderA() {
  $('#panel').innerHTML = `<div class="A" id="A">
    <div class="bar"><span class="count">Today <small id="cnt">${counts()}</small></span>
      <div class="barwrap"><div class="add" id="add"><span class="plus ms">add</span><span class="label">New task</span><input id="in" placeholder="What needs doing?"><button class="send" id="send" title="Add">${ms('arrow_upward')}</button></div></div></div>
    <div class="list" id="list">${listHTML()}</div></div>`;
  const A = $('#A'), add = $('#add'), inp = $('#in');
  const open = () => { if (A.classList.contains('editing')) return; A.classList.add('editing'); add.classList.add('open'); setTimeout(() => inp.focus({ preventScroll: true }), 120 * K); cycle(inp); };
  const close = () => { A.classList.remove('editing'); add.classList.remove('open', 'ready'); inp.value = ''; inp.blur(); };
  add.onclick = e => { if (e.target.closest('#send')) return; open(); };
  inp.oninput = () => add.classList.toggle('ready', inp.value.trim().length > 0);
  const submit = () => {
    const v = inp.value.trim(); if (!v) return;
    const t = { id: ++uid, text: v, done: false };
    // the list makes room (everything glides down) and the new row rises into the gap
    flip($('#list'), () => { tasks.unshift(t); refresh(true); });
    const el = $(`[data-id="${t.id}"]`);
    el.animate([{ opacity: 0, transform: 'translateY(-10px) scale(.985)' }, { opacity: 1, transform: 'none' }], { duration: 640 * K, delay: 60 * K, easing: SMOOTH, fill: 'backwards' });
    // the typed text leaves the field as the placeholder comes back
    inp.value = ''; add.classList.remove('ready');
    inp.animate([{ opacity: 0, transform: 'translateY(-5px)' }, { opacity: 1, transform: 'none' }], { duration: 420 * K, easing: SMOOTH });
    hop();
  };
  $('#send').onclick = submit;
  inp.onkeydown = e => { if (e.key === 'Enter') submit(); if (e.key === 'Escape') close(); };
  inp.onblur = () => setTimeout(() => { if (!inp.value && document.activeElement !== inp) close(); }, 150);
  hopTarget = () => $('#face svg');
}

function renderB() {
  $('#panel').innerHTML = `<div class="B"><div class="hd"><span><b>Today</b><small id="cnt">${counts()}</small></span></div>
    <div class="list" id="list"></div></div>`;
  refresh();
  hopTarget = () => $('.B .peek svg') && $('.ghost.on') ? $('.B .peek svg') : $('#face svg');
}
function ghostHTML() {
  return `<div class="ghost" id="ghost" data-id="ghost"><span class="pl">${ms('add')}</span><input id="in" placeholder="Add a task"><span class="hint"><kbd>Enter</kbd> add</span><span class="peek">${bloub(26)}</span></div>`;
}
function wireGhost(focus) {
  const g = $('#ghost'), inp = $('#in');
  g.onclick = () => inp.focus({ preventScroll: true });
  inp.onfocus = () => { g.classList.add('on'); cycle(inp); };
  inp.onblur = () => setTimeout(() => { if (document.activeElement !== inp) { g.classList.remove('on'); g.classList.remove('ready'); inp.value = ''; } }, 120);
  inp.oninput = () => g.classList.toggle('ready', inp.value.trim().length > 0);
  inp.onkeydown = e => {
    if (e.key === 'Escape') inp.blur();
    if (e.key !== 'Enter') return;
    const v = inp.value.trim(); if (!v) return;
    const t = { id: ++uid, text: v, done: false };
    const list = $('#list');
    flip(list, () => { tasks.splice(tasks.filter(x => !x.done).length, 0, t); refresh(true, true); });
    const el = $(`[data-id="${t.id}"]`);
    // the typed row solidifies in place: the + turns into the ring
    el.animate([{ background: 'rgba(10,132,255,.14)', boxShadow: 'inset 0 0 0 1.5px rgba(10,132,255,.65)' }, { background: 'rgba(255,255,255,.055)', boxShadow: 'inset 0 0 0 1.5px rgba(10,132,255,0)' }], { duration: 700, easing: 'ease-out' });
    $('.ring', el).animate([{ transform: 'scale(.4)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 520, easing: SPRING });
    $('.ring', el).style.transformOrigin = '10px 10px';
    const ng = $('#ghost');
    ng.animate([{ opacity: 0, transform: 'translateY(-10px)' }, { opacity: 1, transform: 'none' }], { duration: 520, easing: SPRING });
    const peek = $('.peek svg', ng);
    if (peek) peek.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-9px)' }, { transform: 'translateY(0)' }], { duration: 480, easing: 'ease-out' });
  };
  if (focus) inp.focus({ preventScroll: true });
}

function renderC() {
  $('#panel').innerHTML = `<div class="C" id="C"><div class="hd"><span><b>Today</b><small id="cnt">${counts()}</small></span></div>
    <div class="list" id="list">${listHTML()}</div>
    <div class="composer" id="comp"><span class="bl" id="cb">${bloub(32)}</span><input id="in" placeholder="Add a task…"><button class="send" id="send">${ms('arrow_upward')}Add</button></div></div>`;
  const comp = $('#comp'), inp = $('#in');
  inp.oninput = () => comp.classList.toggle('ready', inp.value.trim().length > 0);
  inp.onfocus = () => cycle(inp);
  const submit = () => {
    const v = inp.value.trim(); if (!v) return;
    const isl = $('#island').getBoundingClientRect(), sc = isl.width / 724;
    const from = inp.getBoundingClientRect();
    const t = { id: ++uid, text: v, done: false };
    // room opens at the top first
    flip($('#list'), () => { tasks.unshift(t); refresh(true); });
    const el = $(`[data-id="${t.id}"]`);
    el.style.visibility = 'hidden';
    const to = el.getBoundingClientRect();
    const fly = document.createElement('div');
    fly.className = 'fly'; fly.innerHTML = `<i></i>${esc(v)}`;
    $('#island').appendChild(fly);
    const x0 = (from.left - isl.left) / sc - 32, y0 = (from.top - isl.top) / sc - 6, x1 = (to.left - isl.left) / sc, y1 = (to.top - isl.top) / sc;
    fly.style.left = '0px'; fly.style.top = '0px'; fly.style.width = to.width / sc + 'px';
    // Bloub: crouch, then toss
    const cb = $('#cb svg');
    cb.animate([
      { transform: 'translateY(0) scale(1,1)' }, { transform: 'translateY(2px) scale(1.18,.78)', offset: .3 },
      { transform: 'translateY(-14px) scale(.9,1.12)', offset: .55 }, { transform: 'translateY(0) scale(1.06,.94)', offset: .8 }, { transform: 'none' },
    ], { duration: 700, easing: 'ease-out' });
    const mid = { x: (x0 + x1) / 2 + 40, y: Math.min(y0, y1) - 70 };
    const pts = 18, kf = [];
    for (let i = 0; i <= pts; i++) {
      const u = i / pts, a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
      const x = a * x0 + b * mid.x + c * x1, y = a * y0 + b * mid.y + c * y1;
      kf.push({ transform: `translate(${x}px, ${y}px) rotate(${(1 - u) * -8 * Math.sin(u * Math.PI)}deg) scale(${0.72 + 0.28 * u})`, opacity: u < .1 ? u * 10 : 1 });
    }
    fly.animate(kf, { duration: 640, delay: 180, easing: 'cubic-bezier(.35,.0,.25,1)', fill: 'both' }).onfinish = () => {
      fly.remove(); el.style.visibility = '';
      el.animate([{ transform: 'scale(1.03, .9)' }, { transform: 'none' }], { duration: 420, easing: SPRING });
    };
    inp.value = ''; comp.classList.remove('ready');
  };
  $('#send').onclick = submit;
  inp.onkeydown = e => { if (e.key === 'Enter') submit(); if (e.key === 'Escape') inp.blur(); };
  hopTarget = () => $('#cb svg');
  // Bloub watches what you hover in the list
  $('#list').onmousemove = e => { const r = $('#cb').getBoundingClientRect(); const dx = Math.max(-1, Math.min(1, (e.clientX - r.left) / 300)), dy = Math.max(-1, Math.min(1, (e.clientY - r.top) / 200)); $('#cb .eyes').style.transform = `translate(${dx * 1.6}px, ${dy * 1.6}px)`; };
  $('#list').onmouseleave = () => $('#cb .eyes').style.transform = '';
}

/* re-render the list (keeps the field) */
function refresh(noFlip, keepGhostFocus) {
  const list = $('#list'); if (!list) return;
  const go = () => {
    if (design === 'B') {
      const todo = tasks.filter(t => !t.done), done = tasks.filter(t => t.done);
      list.innerHTML = todo.map(row).join('') + ghostHTML() + (done.length ? `<div class="donehd" data-id="donehd"><span>Done · ${done.length}</span><button data-clear>Clear</button></div>` + done.map(row).join('') : '');
      wireGhost(keepGhostFocus);
    } else list.innerHTML = listHTML();
    const cnt = $('#cnt'); if (cnt) cnt.textContent = counts();
  };
  if (noFlip) go(); else flip(list, go);
}

/* placeholder hints cycle while the field is empty */
function cycle(inp) {
  clearInterval(cycle.t); let i = 0;
  cycle.t = setInterval(() => { if (!document.body.contains(inp)) return clearInterval(cycle.t); if (!inp.value) inp.placeholder = HINTS[i++ % HINTS.length] + '…'; }, 2200);
}

/* clicks in the list */
$('#panel').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    e.stopPropagation();
    const el = del.closest('.task');
    el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(-24px) scale(.96)' }], { duration: 260, easing: 'ease-in', fill: 'forwards' }).onfinish = () => {
      tasks = tasks.filter(t => t.id !== +del.dataset.del); refresh();
    };
    return;
  }
  if (e.target.closest('[data-clear]')) {
    const rows = [...document.querySelectorAll('.task.done')];
    rows.forEach((el, i) => el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(8px) scale(.95)' }], { duration: 280, delay: i * 50, easing: 'ease-in', fill: 'forwards' }));
    setTimeout(() => { tasks = tasks.filter(t => !t.done); refresh(); toast('Cleared'); }, 280 + rows.length * 50);
    return;
  }
  const el = e.target.closest('.task');
  if (el) tick(el, tasks.find(t => t.id === +el.dataset.id));
});

function pick(id) {
  design = id;
  const d = DESIGNS.find(d => d.id === id);
  $('#dTitle').textContent = d.title; $('#dText').textContent = d.text;
  document.querySelectorAll('#picker button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  try { localStorage.setItem('tasks-design', id); } catch {}
  ({ A: renderA, B: renderB, C: renderC })[id]();
}
$('#picker').innerHTML = DESIGNS.map((d, i) => `<button data-id="${d.id}">${d.name}<kbd>${i + 1}</kbd></button>`).join('');
$('#picker').addEventListener('click', e => { const b = e.target.closest('button'); if (b) pick(b.dataset.id); });
addEventListener('keydown', e => { if (document.activeElement?.tagName === 'INPUT') return; const d = DESIGNS[+e.key - 1]; if (d) pick(d.id); });
$('#face').innerHTML = bloub(40);
$('#avs').innerHTML = ['#2D8CFF', '#F0479B', '#E5374C', '#7A3BF0'].map(c => bloub(22, c)).join('');
$('#reset').onclick = () => { tasks = START(); pick(design); };
$('#slow').onclick = () => { K = K === 1 ? 3 : 1; document.documentElement.style.setProperty('--k', K); $('#slow span:last-child').textContent = `Slow motion: ${K === 1 ? 'off' : '3×'}`; };

let saved = 'A';
try { saved = new URLSearchParams(location.search).get('d') || localStorage.getItem('tasks-design') || 'A'; } catch {}
pick(DESIGNS.some(d => d.id === saved) ? saved : 'A');
if (location.search.includes('open')) { const i = $('#in'); i?.focus({ preventScroll: true }); $('#add')?.click(); if (i) { i.value = 'Buy oat milk'; i.dispatchEvent(new Event('input')); } }
</script>
</body>
