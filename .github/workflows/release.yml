name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish single-file exe
        run: >
          dotnet publish src/Island.Lab -c Release -o publish
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/IslandLab.exe -DestinationPath IslandLab-${{ github.ref_name }}-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/IslandLab.exe
            IslandLab-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
